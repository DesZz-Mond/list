                window.app.renderActiveView();
            },
            
            renderActiveView: () => {
                if(!window.appState.selectedStudent) return;
                renderNav();
                const v = window.appState.view;
                if(v === 'dashboard') renderDashboard();
                else if(v === 'schedule') renderSchedule(true);
                else if(v === 'main') renderSchedule(false);
                else if(v === 'materials') renderMaterials();
                else if(v === 'homework') renderHomework();
                else if(v === 'register') renderRegister();
                else if(v === 'editor') renderEditor();
                
                lucide.createIcons();
            },

            login: (studentId) => {
                const s = students.find(x => x.id === studentId);
                if(s) {
                    window.appState.selectedStudent = s;
                    localStorage.setItem('selectedStudentId', s.id);
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('app').classList.remove('hidden');
                    window.app.setView('dashboard');
                }
            },

            logout: () => {
                window.appState.selectedStudent = null;
                localStorage.removeItem('selectedStudentId');
                document.getElementById('app').classList.add('hidden');
                document.getElementById('auth-screen').classList.remove('hidden');
                window.app.renderAuthList();
            },

                window.appState.isDark = !window.appState.isDark;

            updateLiveWidget: () => {
                if(window.appState.view !== 'dashboard') return;
                const widget = document.getElementById('live-widget');
                if(!widget) return;

                const now = new Date();
                const days = ["Неділя", "Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота"];
                const curDay = days[now.getDay()];
                const time = now.toTimeString().slice(0,5);
                let cur = null, nxt = null;
                
                for(let i=0; i<timeSlots.length; i++) {
                    if(time >= timeSlots[i].start && time <= timeSlots[i].end) { cur = {...timeSlots[i], idx: i+1}; break; }
                    if(time < timeSlots[i].start) { nxt = {...timeSlots[i], idx: i+1}; break; }
                }
                
                const searchArr = getMergedSchedule(closestWeekObj.t);
                const today = searchArr.find(d => d.day === curDay);
                
                const parseTime = (timeStr) => {
                    const [h, m] = timeStr.split(':').map(Number);
                    const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime();
                };

                let status = {};
                if(cur) {
                    const subj = today?.pairs.find(p => p.num === cur.idx)?.subj || "Пара йде";
                    const start = parseTime(cur.start);
                    const end = parseTime(cur.end);
                    const progress = Math.min(100, Math.max(0, ((Date.now() - start) / (end - start)) * 100));
                    status = { label: 'Зараз триває', title: `${cur.idx} Пара`, subtitle: subj, progress, isLive: true };
                } else if(nxt) {
                    const subj = today?.pairs.find(p => p.num === nxt.idx)?.subj || "Чекаємо...";
                    status = { label: 'Наступна пара', title: `${nxt.idx} Пара (${nxt.start})`, subtitle: subj, progress: 0, isLive: false };
                } else {
                    status = { label: 'Статус', title: 'Пари завершено', subtitle: 'Час для відпочинку ☕', progress: 100, isLive: false };
                }

                widget.innerHTML = `
                    <div class="absolute top-0 right-0 w-64 h-64 bg-teal-500/20 blur-[80px] rounded-full pointer-events-none"></div>
                    <div class="flex flex-col h-full justify-between relative z-10">
                        <div class="flex items-center gap-3 mb-8">
                            ${status.isLive ? `<span class="flex h-3 w-3 relative"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span></span>` : ''}
                            <span class="text-xs font-bold uppercase tracking-widest text-zinc-400">${status.label}</span>
                        </div>
                        <div>
                            <h2 class="text-3xl md:text-5xl font-black text-white tracking-tight mb-2 leading-tight">${status.title}</h2>
                            <p class="text-lg md:text-xl text-zinc-400 font-medium truncate">${status.subtitle}</p>
                        </div>
                        ${status.isLive ? `
                            <div class="mt-8">
                                <div class="h-2 w-full bg-zinc-800 rounded-full overflow-hidden">
                                    <div class="h-full bg-gradient-to-r from-teal-500 via-emerald-500 to-teal-500 bg-[length:200%_200%] animate-gradient-flow transition-all duration-1000 rounded-full" style="width: ${status.progress}%"></div>
                                </div>
                            </div>
                        ` : ''}

                    });

                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'homeworks'), (snap) => {
                        let hw = []; snap.forEach(doc => hw.push(doc.data()));
                        hw.sort((a, b) => b.id - a.id);
                        window.appState.homeworks = hw;
                        localStorage.setItem('portal-homeworks', JSON.stringify(hw));
                        if (['homework', 'dashboard', 'schedule', 'main'].includes(window.appState.view)) window.app.renderActiveView();
                    });

                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), (snap) => {
                        let mat = []; snap.forEach(doc => mat.push(doc.data()));
                        mat.sort((a, b) => b.id - a.id);
                        window.appState.materials = mat;
                        localStorage.setItem('portal-materials', JSON.stringify(mat));
                        if (['materials', 'dashboard'].includes(window.appState.view)) window.app.renderActiveView();
                    });

                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'extra_schedule'), (snap) => {
                        let extra = []; snap.forEach(doc => extra.push({id: doc.id, ...doc.data()}));
                        window.appState.extraSchedule = extra;
                        localStorage.setItem('portal-extra-schedule', JSON.stringify(extra));
                        if (['schedule', 'main', 'editor', 'dashboard'].includes(window.appState.view)) window.app.renderActiveView();
                    });

                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'hidden_schedule'), (snap) => {
                        let hidden = []; snap.forEach(doc => hidden.push({id: doc.id, ...doc.data()}));
                        window.appState.hiddenSchedule = hidden;
                        localStorage.setItem('portal-hidden-schedule', JSON.stringify(hidden));
                        if (['schedule', 'main', 'editor', 'dashboard'].includes(window.appState.view)) window.app.renderActiveView();
                    });
                }
            });

            const savedId = localStorage.getItem('selectedStudentId');
            if (savedId) {
                const s = students.find(x => x.id === parseInt(savedId));
                if (s) {
                    window.appState.selectedStudent = s;
                    document.getElementById('app').classList.remove('hidden');
                    window.app.renderActiveView();
                    return;
                }
            }
            
            document.getElementById('auth-screen').classList.remove('hidden');
            window.app.renderAuthList();
            lucide.createIcons();
        };

        // Run Init
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
