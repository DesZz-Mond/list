        const initParticles = () => {
            const canvas = document.getElementById('interactive-bg');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height, particles = [];
            
            const particleCount = window.innerWidth < 768 ? 40 : 80;
            const connectionDistance = 120;
            const mouseAttractionRadius = 150;

            let mouse = { x: null, y: null };
            window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
            window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

            const resize = () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            };
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 1.5;
                    this.vy = (Math.random() - 0.5) * 1.5;
                    this.size = Math.random() * 2 + 1;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;

                    if (mouse.x) {
                        const dx = mouse.x - this.x;
                        const dy = mouse.y - this.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < mouseAttractionRadius) {
                            this.x += dx * 0.025;
                            this.y += dy * 0.025;
                        }
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    const isDark = window.appState.isDark;
                    ctx.fillStyle = isDark ? 'rgba(255, 255, 255, 0.5)' : 'rgba(0, 0, 0, 0.2)';
                    ctx.fill();
                }
            }

            for (let i = 0; i < particleCount; i++) particles.push(new Particle());

            const animate = () => {
                ctx.clearRect(0, 0, width, height);
                const isDark = window.appState.isDark;
                const lineColor = isDark ? '255, 255, 255' : '0, 0, 0';

                particles.forEach((p, index) => {
                    p.update();
                    p.draw();
                    
                    for (let j = index + 1; j < particles.length; j++) {
                        const p2 = particles[j];
                        const dx = p.x - p2.x;
                        const dy = p.y - p2.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < connectionDistance) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            const opacity = 1 - (distance / connectionDistance);
                            ctx.strokeStyle = `rgba(${lineColor}, ${opacity * 0.15})`;
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }
                });
                requestAnimationFrame(animate);
            };
            animate();
        };

                const sessionId = `${s.id}_${now}`;

                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'analytics_logs', window.appState.currentSessionId), {

                            name: s.name,
                            start: now,
                            end: Date.now(),
                            deviceInfo: devInfo

                updateSession(); 
                window.appState.analyticsInterval = setInterval(updateSession, 5000);

            updateLiveWidget: () => {
                if(window.appState.view !== 'dashboard') return;
                const widget = document.getElementById('live-widget');
                if(!widget) return;
                
                const { pri, sec } = getTheme();

                const now = new Date();
                const days = ["Неділя", "Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота"];
                const curDay = days[now.getDay()];
                const time = now.toTimeString().slice(0,5);
                let cur = null, nxt = null;
                
                for(let i=0; i<timeSlots.length; i++) {
                    if(time >= timeSlots[i].start && time <= timeSlots[i].end) { cur = {...timeSlots[i], idx: i+1}; break; }
                    if(time < timeSlots[i].start) { nxt = {...timeSlots[i], idx: i+1}; break; }
                }
                
                const searchArr = getMergedSchedule(closestWeekObj.t, closestWeekObj.n);
                const today = searchArr.find(d => d.day === curDay);
                
                const parseTime = (timeStr) => {
                    const [h, m] = timeStr.split(':').map(Number);
                    const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime();
                };

                let status = {};
                if(cur) {
                    const subj = today?.pairs.find(p => p.num === cur.idx)?.subj || "Пара йде (вікно?)";
                    const start = parseTime(cur.start);
                    const end = parseTime(cur.end);
                    const progress = Math.min(100, Math.max(0, ((Date.now() - start) / (end - start)) * 100));
                    status = { label: 'Зараз триває', title: `${cur.idx} Пара`, subtitle: subj, progress, isLive: true };
                } else if(nxt) {
                    const subj = today?.pairs.find(p => p.num === nxt.idx)?.subj || "Чекаємо...";
                    status = { label: 'Наступна пара', title: `${nxt.idx} Пара (${nxt.start})`, subtitle: subj, progress: 0, isLive: false };
                } else {
                    status = { label: 'Статус', title: 'Пари завершено', subtitle: 'Час для відпочинку ☕', progress: 100, isLive: false };
                }

                const radius = 40;
                const circumference = 2 * Math.PI * radius;
                const strokeDashoffset = circumference - (status.progress / 100) * circumference;

                widget.innerHTML = `
                    <div class="absolute top-[-50%] right-[-20%] w-[80%] h-[150%] bg-gradient-to-bl from-${pri}-500/20 to-transparent blur-[80px] rounded-full pointer-events-none"></div>
                    
                    <div class="flex items-center gap-2 mb-auto z-10">
                        ${status.isLive ? `<span class="flex h-2.5 w-2.5 relative"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span></span>` : '<div class="w-2.5 h-2.5 rounded-full bg-zinc-600"></div>'}

                    <div class="flex items-center justify-between z-10 mt-6">
                        <div class="pr-4">
                            <h2 class="text-4xl md:text-5xl font-black text-white tracking-tight mb-2">${status.title}</h2>
                            <p class="text-[15px] text-zinc-400 font-medium line-clamp-2 leading-relaxed">${status.subtitle}</p>
                        </div>
                        
                        ${status.isLive ? `
                            <div class="relative w-24 h-24 shrink-0 flex items-center justify-center">
                                <svg class="transform -rotate-90 w-24 h-24">
                                    <circle cx="48" cy="48" r="${radius}" stroke="currentColor" stroke-width="6" fill="transparent" class="text-zinc-800" />
                                    <circle cx="48" cy="48" r="${radius}" stroke="currentColor" stroke-width="6" fill="transparent" stroke-dasharray="${circumference}" stroke-dashoffset="${strokeDashoffset}" class="text-${pri}-500 transition-all duration-1000 ease-in-out" stroke-linecap="round" />
                                </svg>
                                <div class="absolute inset-0 flex items-center justify-center text-white font-bold text-sm">${Math.round(status.progress)}%</div>
                            </div>
                        ` : ''}
                    </div>
                `;
            },

                                </div>
                                
                                <div class="space-y-4 mb-8">
                                    <input id="modal-mat-title" autofocus type="text" placeholder="Назва ресурсу..." class="w-full p-4 bg-white/50 dark:bg-black/40 text-zinc-900 dark:text-white border border-zinc-200/80 dark:border-white/10 focus:ring-2 ring-zinc-900 dark:ring-white outline-none rounded-[18px] text-[15px] font-bold shadow-inner backdrop-blur-sm" />
                                    <input id="modal-mat-url" type="url" placeholder="Посилання (https://...)" class="w-full p-4 bg-white/50 dark:bg-black/40 text-zinc-900 dark:text-white border border-zinc-200/80 dark:border-white/10 focus:ring-2 ring-zinc-900 dark:ring-white outline-none rounded-[18px] text-[15px] font-medium shadow-inner backdrop-blur-sm" />
                                    <div class="relative">
                                        <select id="modal-mat-subj" class="w-full p-4 bg-white/50 dark:bg-black/40 text-zinc-900 dark:text-white border border-zinc-200/80 dark:border-white/10 focus:ring-2 ring-zinc-900 dark:ring-white outline-none rounded-[18px] text-[14px] font-bold cursor-pointer appearance-none shadow-inner backdrop-blur-sm">
                                            ${['Загальне', 'Маркетинг', 'Політологія', 'Екаунтинг', 'Публічне адміністрування', 'Соціологія', 'Соціальне підприємництво', 'Підприємництво', 'БЗВП', 'Іноземна мова', 'Друга іноземна'].map(o => `<option value="${o}" class="bg-white dark:bg-zinc-900 text-zinc-900 dark:text-white">${o}</option>`).join('')}
                                        </select>
                                        <i data-lucide="chevron-down" class="absolute right-5 top-1/2 -translate-y-1/2 text-zinc-400 w-5 h-5 pointer-events-none"></i>
                                    </div>
                                </div>
                                <div class="flex gap-3">
                                    <button onclick="window.app.closeModal()" class="flex-1 py-4 rounded-[18px] font-bold text-sm bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-zinc-700 transition-colors active:scale-95">Скасувати</button>
                                    <button onclick="window.app.saveMaterial()" class="flex-[2] py-4 rounded-[18px] font-bold text-sm bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 shadow-lg transition-all active:scale-95 tracking-wide">Додати посилання</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('modals').innerHTML = html;
                lucide.createIcons();
            },

            saveMaterial: () => {
                const title = document.getElementById('modal-mat-title').value.trim();
                let url = document.getElementById('modal-mat-url').value.trim();
                const subj = document.getElementById('modal-mat-subj').value;
                
                if(!title || !url) return;
                if(!url.startsWith('http')) url = 'https://' + url;
                
                const docId = Date.now().toString();
                const newMat = { id: docId, title, url, subj, author: window.appState.selectedStudent.name, date: new Date().toLocaleDateString('uk-UA') };
                
                writeToCloud('materials', docId, newMat, () => {
                    window.appState.materials.unshift(newMat);
                    window.app.renderActiveView();
                });
                window.app.closeModal();
            },

            openZoomModal: (encodedSubj) => {
                const { pri } = getTheme();
                const subj = decodeURIComponent(encodedSubj);
                const currentLink = window.appState.zoomLinksData[subj] || '';
                window.appState.tempZoomSubj = subj;

                const html = `
                    <div class="fixed inset-0 z-[300] bg-zinc-900/60 dark:bg-black/80 flex items-center justify-center p-4 backdrop-blur-xl animate-fade-in" onclick="window.app.closeModal()">
                        <div class="w-full max-w-lg glass-panel p-8 relative overflow-hidden rounded-[40px]" onclick="event.stopPropagation()" style="animation: slideUpModal 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards">
                            <div class="absolute top-0 right-0 w-64 h-64 bg-blue-500/10 blur-[60px] rounded-full pointer-events-none"></div>
                            <button onclick="window.app.closeModal()" class="absolute top-6 right-6 w-10 h-10 flex items-center justify-center rounded-full bg-zinc-100 dark:bg-white/10 text-zinc-500 transition-all z-10 hover:scale-110 active:scale-95"><i data-lucide="x" class="w-5 h-5"></i></button>
                            
                            <div class="relative z-10">
                                <div class="flex items-center gap-4 mb-6">
                                    <div class="w-12 h-12 bg-blue-50 dark:bg-blue-500/20 rounded-[16px] flex items-center justify-center text-blue-600 dark:text-blue-400 border border-blue-100 dark:border-blue-500/20"><i data-lucide="video" class="w-6 h-6"></i></div>
                                    <h2 class="text-2xl font-black text-zinc-900 dark:text-white tracking-tight">Zoom Лінк</h2>
                                </div>
                                <p class="text-blue-700 dark:text-blue-300 font-bold text-[11px] mb-8 px-3 py-1.5 bg-blue-50/80 dark:bg-blue-500/10 rounded-lg inline-block tracking-wide border border-blue-100 dark:border-blue-500/20">${subj}</p>
                                
                                <div class="relative mb-8">
                                    <i data-lucide="link" class="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400 w-5 h-5"></i>
                                    <input id="modal-zoom-url" autofocus type="url" value="${currentLink}" placeholder="https://zoom.us/j/..." class="w-full pl-11 pr-4 py-4 bg-white/50 dark:bg-black/40 text-zinc-900 dark:text-white border border-zinc-200/80 dark:border-white/10 outline-none focus:ring-2 ring-zinc-900 dark:ring-white rounded-[18px] text-[15px] font-medium shadow-inner backdrop-blur-sm" />
                                </div>
                                <div class="flex gap-3">
                                    <button onclick="window.app.closeModal()" class="flex-1 py-4 rounded-[18px] font-bold text-sm bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-zinc-700 transition-colors active:scale-95">Скасувати</button>
                                    <button onclick="window.app.saveZoomLink()" class="flex-[2] py-4 rounded-[18px] font-bold text-sm bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 shadow-lg transition-all active:scale-95 tracking-wide">Зберегти лінк</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('modals').innerHTML = html;
                lucide.createIcons();
            },

            saveZoomLink: () => {
                let url = document.getElementById('modal-zoom-url').value.trim();
                const subj = window.appState.tempZoomSubj;
                if(!url) return;
                if(!url.startsWith('http')) url = 'https://' + url;
                
                const safeId = subj.replace(/\//g, '_');
                writeToCloud('zoom_links', safeId, { url: url }, () => {
                    window.appState.zoomLinksData[subj] = url;
                    window.app.renderActiveView();
                });
                window.app.closeModal();
            },

            deleteHomework: (id) => { window.app.openConfirmModal("Видалити ДЗ?", "Завдання буде видалено для всіх.", `window.app._doDeleteHW('${id}')`); },
            _doDeleteHW: (id) => {
                removeFromCloud('homeworks', id, () => {
                    window.appState.homeworks = window.appState.homeworks.filter(h => h.id !== id);
                    window.app.renderActiveView();
                });
            },

            deleteMaterial: (id) => { window.app.openConfirmModal("Видалити матеріал?", "Він зникне у всієї групи.", `window.app._doDeleteMat('${id}')`); },
            _doDeleteMat: (id) => {
                removeFromCloud('materials', id, () => {
                    window.appState.materials = window.appState.materials.filter(m => m.id !== id);
                    window.app.renderActiveView();
                });
            },

            handleScheduleAction: (id, isCustom, encodedSubj, weekType, day, num, weekNum) => {
                const subj = decodeURIComponent(encodedSubj);
                if (isCustom) {
                    window.app.openConfirmModal("Видалити пару?", "Вона зникне з розкладу назавжди.", `window.app._doDeleteExtra('${id}')`);
                } else {
                    const promptText = weekNum ? `Ця пара буде скасована тільки для ${weekNum} тижня.` : `Ця пара буде прихована назавжди (в шаблоні).`;
                    window.app.openConfirmModal("Скасувати пару?", promptText, `window.app._doHideSubj('${subj}', '${weekType}', '${day}', ${num}, ${weekNum || 'null'})`);
                }
            },
            _doDeleteExtra: (id) => {
                removeFromCloud('extra_schedule', id, () => {
                    window.appState.extraSchedule = window.appState.extraSchedule.filter(x => x.id !== id);
                    window.app.renderActiveView();
                });
            },
            _doHideSubj: (subj, weekType, day, num, targetWeekNum) => {
                const parsedTargetWeek = (targetWeekNum && targetWeekNum !== 'null') ? parseInt(targetWeekNum) : null;
                const docId = Date.now().toString();
                const newHidden = { id: docId, weekType, day, num: parseInt(num), subj, author: window.appState.selectedStudent.name, targetWeekNum: parsedTargetWeek };
                writeToCloud('hidden_schedule', docId, newHidden, () => {
                    window.appState.hiddenSchedule.push(newHidden);
                    window.app.renderActiveView();
                });
            },

            addExtraSchedule: () => {
                const edWeek = document.getElementById('ed-week').value;
                const edDay = document.getElementById('ed-day').value;
                const edNum = document.getElementById('ed-num').value;
                const edSubjRaw = document.getElementById('ed-subj').value;
                const targetWeekNum = document.getElementById('ed-target-week').value || null;
                const [subj, type, map] = edSubjRaw.split('|');

                const docId = Date.now().toString();
                const newPair = { id: docId, weekType: edWeek, day: edDay, num: parseInt(edNum), subj, type, map, author: window.appState.selectedStudent.name, targetWeekNum: targetWeekNum ? parseInt(targetWeekNum) : null };
                
                writeToCloud('extra_schedule', docId, newPair, () => {
                    window.appState.extraSchedule.push(newPair);
                    window.app.renderActiveView();
                });
            },

            deleteExtraSchedule: (id) => { window.app.openConfirmModal("Видалити пару?", "Вона назавжди зникне.", `window.app._doDeleteExtra('${id}')`); },

            restoreHiddenSchedule: (id) => { window.app.openConfirmModal("Відновити пару?", "Пара знову з'явиться в розкладі.", `window.app._doRestoreHidden('${id}')`); },
            _doRestoreHidden: (id) => {
                removeFromCloud('hidden_schedule', id, () => {
                    window.appState.hiddenSchedule = window.appState.hiddenSchedule.filter(x => x.id !== id);
                    window.app.renderActiveView();
                });
            }
        };

        // --- INIT APP ---
        const initApp = async () => {
            initParticles();

            if (window.appState.isDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');

            window.app.setColorTheme(window.appState.colorTheme, true);

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error(err);
                showToast("Помилка підключення до бази", true);
            }

            onAuthStateChanged(auth, (user) => {
                window.appState.firebaseUser = user;
                if(user) {
                    onSnapshot(
                        collection(db, 'artifacts', appId, 'public', 'data', 'zoom_links'),
                        (snap) => {
                            let links = {}; snap.forEach(doc => links[doc.id] = doc.data().url);
                            window.appState.zoomLinksData = links;
                            localStorage.setItem('portal-custom-zoom', JSON.stringify(links));
                            if (['schedule', 'main'].includes(window.appState.view)) window.app.renderActiveView();
                        },
                        (error) => console.error('Zoom links error:', error)
                    );

                    onSnapshot(
                        collection(db, 'artifacts', appId, 'public', 'data', 'homeworks'),
                        (snap) => {
                            let hw = []; snap.forEach(doc => hw.push(doc.data()));
                            hw.sort((a, b) => b.id - a.id);
                            window.appState.homeworks = hw;
                            localStorage.setItem('portal-homeworks', JSON.stringify(hw));
                            if (['homework', 'dashboard', 'schedule', 'main'].includes(window.appState.view)) window.app.renderActiveView();
                        },
                        (error) => console.error('Homeworks error:', error)
                    );

                    onSnapshot(
                        collection(db, 'artifacts', appId, 'public', 'data', 'materials'),
                        (snap) => {
                            let mat = []; snap.forEach(doc => mat.push(doc.data()));
                            mat.sort((a, b) => b.id - a.id);
                            window.appState.materials = mat;
                            localStorage.setItem('portal-materials', JSON.stringify(mat));
                            if (['materials', 'dashboard'].includes(window.appState.view)) window.app.renderActiveView();
                        },
                        (error) => console.error('Materials error:', error)
                    );

                    onSnapshot(
                        collection(db, 'artifacts', appId, 'public', 'data', 'extra_schedule'),
                        (snap) => {
                            let extra = []; snap.forEach(doc => extra.push({id: doc.id, ...doc.data()}));
                            window.appState.extraSchedule = extra;
                            localStorage.setItem('portal-extra-schedule', JSON.stringify(extra));
                            if (['schedule', 'main', 'editor', 'dashboard'].includes(window.appState.view)) window.app.renderActiveView();
                        },
                        (error) => console.error('Extra schedule error:', error)
                    );

                    onSnapshot(
                        collection(db, 'artifacts', appId, 'public', 'data', 'hidden_schedule'),
                        (snap) => {
                            let hidden = []; snap.forEach(doc => hidden.push({id: doc.id, ...doc.data()}));
                            window.appState.hiddenSchedule = hidden;
                            localStorage.setItem('portal-hidden-schedule', JSON.stringify(hidden));
                            if (['schedule', 'main', 'editor', 'dashboard'].includes(window.appState.view)) window.app.renderActiveView();
                        },
                        (error) => console.error('Hidden schedule error:', error)
                    );
                    
                    window.app.initAnalyticsListener();
                }
            });

            const savedId = localStorage.getItem('selectedStudentId');
            if (savedId) {
                const s = students.find(x => x.id === parseInt(savedId));
                if (s) {
                    window.appState.selectedStudent = s;
                    document.getElementById('app').classList.remove('hidden');
                    window.app.renderActiveView();
                    
                    initMultiplayer();
                    window.app.startAnalyticsSession();

                    return;
                }
            }
            
            document.getElementById('auth-screen').classList.remove('hidden');
            window.app.renderAuthList();
            lucide.createIcons();
        };

        // Run Init
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
