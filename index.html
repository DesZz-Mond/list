<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="color-scheme" content="dark">
    <meta name="description" content="Преміальний студентський портал МБ-302 з розкладом, завданнями, матеріалами та аналітикою.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        slideInRight: {
                            '0%': { opacity: '0', transform: 'translateX(-20px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' }
                        },
                        scaleIn: {
                            '0%': { opacity: '0', transform: 'scale(0.92)' },
                            '100%': { opacity: '1', transform: 'scale(1)' }
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.85)' },
                            '60%': { opacity: '1', transform: 'scale(1.03)' },
                            '100%': { opacity: '1', transform: 'scale(1)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0) scale(1)' },
                            '50%': { transform: 'translateY(-15px) scale(1.05)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: 0.5, transform: 'scale(1)' },
                            '50%': { opacity: 0.8, transform: 'scale(1.1)' }
                        }
                    },
                    animation: {
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both',
                        'slide-in-right': 'slideInRight 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both',
                        'scale-in': 'scaleIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both',
                        'pop-in': 'popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both',
                        'pulse-slow': 'pulseGlow 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 8s ease-in-out infinite',
                    }
                }
            }
        }
    </script>

    <style>
        /* Modern Scrollbar for Desktop */
        @media (min-width: 768px) {
            ::-webkit-scrollbar { width: 8px; height: 8px; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 12px; border: 2px solid transparent; background-clip: padding-box; }
            .dark ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border: 2px solid transparent; background-clip: padding-box; }
            ::-webkit-scrollbar-thumb:hover { background-color: rgba(156, 163, 175, 0.7); }
        }

        /* Hide scrollbar for mobile horizontal scroll areas */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; scroll-behavior: smooth; }
        
        @keyframes slideUpModal {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @media (min-width: 768px) {
            @keyframes slideUpModal {
                from { transform: translateY(20px) scale(0.96); opacity: 0; }
                to { transform: translateY(0) scale(1); opacity: 1; }
            }
        }
        
        body { 
            -webkit-tap-highlight-color: transparent; 
        }

        /* Redesigned Glassmorphism Utilities */
        .glass-panel { background: rgba(255,255,255,.70); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,.60); box-shadow: 0 8px 30px rgba(0,0,0,.04); }
        .glass-card { background: rgba(255,255,255,.60); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.70); box-shadow: 0 4px 20px rgba(0,0,0,.03); transition: all .3s ease; }
        
        /* Gradient Text */
        .text-gradient { background-clip: text; -webkit-background-clip: text; color: transparent; }

        #main-content { transition: opacity 0.25s ease, transform 0.25s ease; }

        /* Safe area padding for mobile bottom nav and modals */
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 1rem); }
        .pt-safe { padding-top: calc(env(safe-area-inset-top) + 0.5rem); }
    
        /* =========================================================
           MB-302 PREMIUM V2 — additive visual system
           ========================================================= */
        :root {
            --premium-radius-xl: 32px;
            --premium-radius-lg: 24px;
            --premium-ease: cubic-bezier(.2,.75,.2,1);
            --premium-border-dark: rgba(255,255,255,.10);
            --premium-shadow-dark: 0 24px 80px rgba(0,0,0,.34), 0 2px 10px rgba(0,0,0,.22);
        }

        html {
            scroll-behavior: smooth;
            text-rendering: optimizeLegibility;
        }

        body {
            background:
                radial-gradient(circle at 15% 0%, rgba(139,92,246,.08), transparent 28%),
                radial-gradient(circle at 85% 10%, rgba(236,72,153,.06), transparent 26%),
                #f7f7f8;
        }

        .dark body {
            background:
                radial-gradient(circle at 15% 0%, rgba(139,92,246,.11), transparent 28%),
                radial-gradient(circle at 85% 10%, rgba(236,72,153,.08), transparent 26%),
                #08080a;
        }

        #pointer-glow {
            position: fixed;
            width: 34rem;
            height: 34rem;
            left: 0;
            top: 0;
            transform: translate3d(calc(var(--pointer-x, -50%) - 17rem), calc(var(--pointer-y, -50%) - 17rem), 0);
            background: radial-gradient(circle, rgba(139,92,246,.13) 0%, rgba(139,92,246,.06) 24%, transparent 66%);
            filter: blur(18px);
            pointer-events: none;
            z-index: 0;
            opacity: .85;
            transition: opacity .5s ease;
        }

        .dark #pointer-glow {
            background: radial-gradient(circle, rgba(139,92,246,.15) 0%, rgba(217,70,239,.08) 22%, transparent 68%);
            opacity: .9;
        }

        .ambient-grid {
            position: absolute;
            inset: 0;
            opacity: .24;
            background-image:
                linear-gradient(rgba(15,23,42,.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15,23,42,.045) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 82%);
        }

        .dark .ambient-grid {
            opacity: .17;
            background-image:
                linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
        }

        .ambient-noise {
            position: absolute;
            inset: 0;
            opacity: .035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
            mix-blend-mode: soft-light;
        }

        .glass-panel,
        .glass-card {
            backdrop-filter: blur(28px) saturate(145%);
            -webkit-backdrop-filter: blur(28px) saturate(145%);
        }

        .glass-panel {
        }

        .dark .glass-panel {
            box-shadow: var(--premium-shadow-dark);
        }

        .glass-card {
            box-shadow: 0 12px 40px rgba(15,23,42,.055), inset 0 1px 0 rgba(255,255,255,.48);
            transition:
                transform .45s var(--premium-ease),
                box-shadow .45s var(--premium-ease),
                border-color .45s ease,
                background-color .45s ease;
        }

        .dark .glass-card {
            box-shadow: 0 14px 48px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.045);
        }

        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 24px 70px rgba(15,23,42,.10), inset 0 1px 0 rgba(255,255,255,.62);
        }

        .dark .glass-card:hover {
            box-shadow: 0 28px 80px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.07);
        }

        header > div {
            box-shadow:
                0 10px 32px rgba(15,23,42,.07),
                0 2px 7px rgba(15,23,42,.04),
                inset 0 1px 0 rgba(255,255,255,.7);
        }

        .dark header > div {
            box-shadow:
                0 16px 46px rgba(0,0,0,.32),
                0 2px 10px rgba(0,0,0,.18),
                inset 0 1px 0 rgba(255,255,255,.055);
        }

        #main-content {
            will-change: opacity, transform;
        }

        #main-content > div > * {
            contain: layout paint;
        }

        /* Modern buttons / interactive controls */
        button, a {
            -webkit-tap-highlight-color: transparent;
        }

        button:not(:disabled),
        a {
            transition:
                transform .22s var(--premium-ease),
                box-shadow .22s ease,
                background-color .22s ease,
                border-color .22s ease,
                color .22s ease;
        }

        button:active:not(:disabled),
        a:active {
            transform: scale(.97);
        }

        input, textarea, select {
            transition:
                border-color .22s ease,
                box-shadow .22s ease,
                background-color .22s ease,
                transform .22s var(--premium-ease);
        }

        input:focus, textarea:focus, select:focus {
            transform: translateY(-1px);
        }

        /* Better mobile rhythm */
        @media (max-width: 767px) {
            #pointer-glow {
                display: none;
            }

            body {
                font-size: 15px;
            }

            #main-content {
                padding-left: .9rem !important;
                padding-right: .9rem !important;
            }

            header {
                width: calc(100% - 1rem) !important;
            }

            header > div {
                border-radius: 20px !important;
            }

            .glass-card:hover {
                transform: none;
            }

            .glass-panel,
            .glass-card {
                box-shadow: 0 10px 30px rgba(15,23,42,.06);
            }

            .dark .glass-panel,
            .dark .glass-card {
                box-shadow: 0 14px 36px rgba(0,0,0,.24);
            }
        }

        /* Premium page-enter polish */
        @keyframes premiumPageEnter {
            from {
                opacity: 0;
                transform: translateY(18px) scale(.985);
                filter: blur(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .premium-enter {
            animation: premiumPageEnterOpacity .45s ease both;
        }

        @keyframes premiumPageEnterOpacity {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .premium-shine {
            position: relative;
            overflow: hidden;
        }

        .premium-shine::after {
            content: "";
            position: absolute;
            inset: -120% 35% -120% -35%;
            background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.14) 50%, transparent 65%);
            transform: translateX(-120%);
            transition: transform 1.1s ease;
            pointer-events: none;
        }

        .premium-shine:hover::after {
            transform: translateX(220%);
        }

        button, a, input, select, textarea { touch-action: manipulation; }
        img, svg, canvas { max-width: 100%; }
        @media (max-width: 390px) {
            header > div { padding-left: .35rem !important; padding-right: .35rem !important; }
            #header-logo-bg { width: 2.4rem !important; height: 2.4rem !important; }
            main { padding-left: .65rem !important; padding-right: .65rem !important; }
        }

        /* =========================================================
           V3 VISUAL CORE — dark-only, truly switchable backgrounds
           ========================================================= */
        :root {
            --portal-base: #09090b;
            --portal-accent-a: rgba(124,58,237,.26);
            --portal-accent-b: rgba(217,70,239,.20);
            --portal-accent-c: rgba(59,130,246,.12);
        }

        body {
            background: var(--portal-base) !important;
            color: #e4e4e7;
            min-width: 320px;
        }

        .portal-bg-layer {
            background: radial-gradient(circle at 12% 12%, var(--portal-accent-a), transparent 31%),
                        radial-gradient(circle at 88% 18%, var(--portal-accent-b), transparent 29%),
                        radial-gradient(circle at 60% 86%, var(--portal-accent-c), transparent 34%),
                        var(--portal-base);
            transition: background 700ms cubic-bezier(.2,.75,.2,1);
            will-change: background;
        }

        .portal-bg-layer::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,.018), transparent 28%, rgba(0,0,0,.16));
        }

        .portal-bg-layer::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 40%, transparent 0%, rgba(0,0,0,.14) 68%, rgba(0,0,0,.34) 100%);
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(10,10,13,.64) !important;
            border-color: rgba(255,255,255,.09) !important;
            box-shadow: 0 18px 60px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.045);
        }

        .glass-card {
            background: rgba(12,12,16,.52) !important;
            border-color: rgba(255,255,255,.075) !important;
            box-shadow: 0 14px 46px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.035);
        }

        .glass-card:hover {
            background: rgba(18,18,23,.66) !important;
            border-color: rgba(255,255,255,.13) !important;
        }

        .dark .bg-white\/60, .dark .bg-white\/70, .dark .bg-white\/80, .dark .bg-white\/90 {
            background-color: rgba(12,12,16,.56) !important;
        }

        .compact-live-widget { min-height: 0 !important; }

        @media (max-width: 767px) {
            #app { transform: none !important; }
            .portal-bg-layer {
                background: radial-gradient(circle at 18% 10%, var(--portal-accent-a), transparent 40%),
                            radial-gradient(circle at 88% 18%, var(--portal-accent-b), transparent 36%),
                            var(--portal-base);
            }
            .glass-panel { background: rgba(9,9,12,.78) !important; }
            .glass-card { background: rgba(11,11,15,.68) !important; }
            header { top: .45rem !important; }
            #main-content { padding-top: 8rem !important; }
        }

        @media (min-width: 768px) {
            #main-content { padding-left: clamp(1rem,2vw,2rem) !important; padding-right: clamp(1rem,2vw,2rem) !important; }
        }

        @media (max-width: 767px) {
            #mobile-nav { gap: .15rem; }
            #mobile-nav > button { min-width: 0; }
            #mobile-nav .lucide { flex: 0 0 auto; }
            #mobile-nav span { line-height: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }

            *,
            *::before,
            *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
                scroll-behavior: auto !important;
            }

            #pointer-glow,
            .ambient-noise {
                display: none !important;
            }

            .glass-card:hover {
                transform: none !important;
            }
        }

    
        /* Background switcher */
        .bg-choice {
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }
        .bg-choice::before {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--bg-preview);
            opacity: .95;
            z-index: -1;
        }
        .bg-choice.is-active {
            box-shadow: 0 0 0 2px rgba(139,92,246,.55), 0 10px 28px rgba(15,23,42,.12);
            transform: translateY(-1px);
        }
        .premium-bg-aurora {
            background:
                radial-gradient(circle at 16% 16%, rgba(139,92,246,.30), transparent 28%),
                radial-gradient(circle at 84% 16%, rgba(236,72,153,.24), transparent 26%),
                radial-gradient(circle at 70% 80%, rgba(59,130,246,.18), transparent 30%),
                #09090b;
        }
        .premium-bg-sunset {
            background:
                radial-gradient(circle at 15% 15%, rgba(251,146,60,.28), transparent 28%),
                radial-gradient(circle at 85% 20%, rgba(244,63,94,.24), transparent 26%),
                radial-gradient(circle at 55% 90%, rgba(168,85,247,.16), transparent 34%),
                #100b0d;
        }
        .premium-bg-ocean {
            background:
                radial-gradient(circle at 10% 20%, rgba(14,165,233,.30), transparent 30%),
                radial-gradient(circle at 80% 18%, rgba(6,182,212,.22), transparent 28%),
                radial-gradient(circle at 70% 80%, rgba(37,99,235,.18), transparent 33%),
                #071015;
        }
        .premium-bg-forest {
            background:
                radial-gradient(circle at 15% 15%, rgba(16,185,129,.25), transparent 28%),
                radial-gradient(circle at 85% 15%, rgba(132,204,22,.16), transparent 24%),
                radial-gradient(circle at 60% 80%, rgba(20,83,45,.30), transparent 36%),
                #07100c;
        }
        .premium-bg-mono {
            background:
                radial-gradient(circle at 50% 10%, rgba(255,255,255,.10), transparent 28%),
                linear-gradient(145deg, #171717, #080808 62%);
        }
        /* Compact current-pair widget */
        .compact-live-widget {
            min-height: 0 !important;
            height: auto !important;
        }

        .compact-live-widget .live-widget-inner {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .compact-live-widget .live-widget-copy {
            min-width: 0;
            flex: 1;
        }

        .compact-live-widget .live-widget-title {
            font-size: clamp(1.35rem, 2.4vw, 2.15rem) !important;
            line-height: 1.05 !important;
            margin-bottom: .4rem !important;
        }

        .compact-live-widget .live-widget-subtitle {
            font-size: clamp(.78rem, 1vw, .95rem) !important;
            line-height: 1.35 !important;
        }

        .compact-live-widget .live-widget-progress {
            flex: 0 0 auto;
        }

        .deadline-card {
            transition:
                transform .25s cubic-bezier(.2,.75,.2,1),
                box-shadow .25s ease,
                border-color .25s ease;
        }

        .deadline-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 42px rgba(15,23,42,.10);
        }

        .dark .deadline-card:hover {
            box-shadow: 0 20px 48px rgba(0,0,0,.32);
        }

        @media (max-width: 767px) {
            .compact-live-widget {
                border-radius: 26px !important;
            }
            .compact-live-widget .live-widget-inner {
                gap: .75rem;
            }
            .compact-live-widget .live-widget-title {
                font-size: 1.35rem !important;
            }
        }

    
        body.premium-bg-aurora,
        body.premium-bg-sunset,
        body.premium-bg-ocean,
        body.premium-bg-forest,
        body.premium-bg-mono {
            background-attachment: fixed !important;
            background-size: cover !important;
            background-repeat: no-repeat !important;
        }
        body.premium-bg-aurora,
        body.premium-bg-sunset,
        body.premium-bg-ocean,
        body.premium-bg-forest,
        body.premium-bg-mono {
            color-scheme: dark;
            background-color: #08090c !important;
        }

        /* Premium geometry background */
        .geometry-field {
            position:absolute; inset:0; overflow:hidden; opacity:.55;
            pointer-events:none;
        }
        .geometry-shape {
            position:absolute; display:block; border:1px solid rgba(255,255,255,.075);
            border-radius:28px; transform:rotate(45deg);
            box-shadow:0 0 70px rgba(139,92,246,.045) inset, 0 0 35px rgba(255,255,255,.02);
        }
        .geometry-shape-a { width:320px; height:320px; right:-120px; top:14%; }
        .geometry-shape-b { width:210px; height:210px; left:-100px; bottom:14%; border-radius:52px; opacity:.8; }
        .geometry-shape-c { width:120px; height:120px; right:22%; bottom:7%; border-radius:18px; transform:rotate(18deg); opacity:.6; }

        .geometry-line-a { width:68vw; left:-8vw; top:34%; transform:rotate(-13deg); }
        .geometry-line-b { width:54vw; right:-10vw; top:63%; transform:rotate(19deg); }
        .appearance-trigger, .appearance-trigger * { pointer-events:auto !important; }
        .appearance-trigger { position:relative; z-index:80; isolation:isolate; }
        #mobile-dock { padding-bottom: env(safe-area-inset-bottom); }
        @media (max-width:767px) {
            body { padding-bottom: 5.2rem; }
            .geometry-shape-a { width:220px; height:220px; right:-100px; top:10%; }
            .geometry-shape-b { width:160px; height:160px; left:-80px; bottom:18%; }
            .geometry-shape-c { width:90px; height:90px; right:17%; bottom:10%; }
            .geometry-line-a { width:120vw; left:-22vw; top:31%; }
            .geometry-line-b { width:105vw; right:-35vw; top:66%; }
        }


        /* ===== FINAL POLISH: LIQUID GLASS + THEME-AWARE GEOMETRY ===== */
        header {
            position: fixed !important;
            isolation: isolate;
            pointer-events: none;
        }
        header > div {
            pointer-events: auto;
            background: linear-gradient(180deg, rgba(20,20,26,.68), rgba(9,9,13,.58)) !important;
            border: 1px solid rgba(255,255,255,.12) !important;
            backdrop-filter: blur(34px) saturate(170%) !important;
            -webkit-backdrop-filter: blur(34px) saturate(170%) !important;
            box-shadow: 0 24px 80px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.10), inset 0 0 0 1px rgba(255,255,255,.025) !important;
            position: relative;
            overflow: visible;
        }
        header > div::before, #mobile-dock nav::before {
            content: ''; position: absolute; inset: 1px; border-radius: inherit; pointer-events:none;
            background: linear-gradient(115deg, rgba(255,255,255,.12), transparent 23%, transparent 76%, rgba(255,255,255,.04));
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude; padding: 1px; opacity: .7;
        }
        .appearance-trigger {
            position: relative !important; z-index: 90 !important;
            pointer-events: auto !important; cursor: pointer !important;
            touch-action: manipulation !important;
        }
        .appearance-trigger > svg, .appearance-trigger > i { pointer-events: none !important; }
        #theme-dropdown-main, #background-dropdown-main, #theme-dropdown-auth {

                const start = new Date(2026, sm - 1, sd);
                const end = new Date(2026, em - 1, ed, 23, 59, 59);

                if (!raw) return fallback;
                const value = JSON.parse(raw);
                return value ?? fallback;
            } catch (error) {
                console.warn(`Invalid local data for ${key}; resetting it.`, error);
                try { localStorage.removeItem(key); } catch (e) {}
                return fallback;
            }
        };

            try {
                const remembered = safeStorageJson(DEVICE_PROFILE_KEY, null);
                const id = remembered?.studentId;
                if (Number.isFinite(Number(id)) && Number(id) > 0) return Number(id);
            } catch (e) {}

            try {
                const legacy = Number(localStorage.getItem('selectedStudentId'));
                if (Number.isFinite(legacy) && legacy > 0) return legacy;
            } catch (e) {}

            // Small cookie fallback for environments where localStorage is unavailable.
            try {
                const match = document.cookie.split('; ').find(row => row.startsWith(DEVICE_PROFILE_COOKIE + '='));
                const id = match ? decodeURIComponent(match.split('=').slice(1).join('=')) : '';
                const parsed = Number(id);
                return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
            } catch (e) {
                return null;
            }
        };

        const getMergedSchedule = (weekType, weekNum) => {
            let base = (weekNum && Number(weekNum) >= 3) ? [] : (mainScheduleData[weekType] ? JSON.parse(JSON.stringify(mainScheduleData[weekType])) : []);

            // Поки у порталі є лише лекційна начитка: практичні/мовні пари не показуємо.
            base.forEach(d => {
                d.pairs = d.pairs.filter(p => /\sЛ(?:$|\s)/i.test(p.subj));
            });

            const extras = window.appState.extraSchedule.filter(ep => {
                if (ep.weekType !== weekType) return false;
                if (ep.targetWeekNum) {
                    if (!weekNum || parseInt(ep.targetWeekNum) !== parseInt(weekNum)) return false;
                }
                return true;
            });

            extras.forEach(ep => {
                let dayObj = base.find(d => d.day === ep.day);
                if (!dayObj) { dayObj = { day: ep.day, pairs: [] }; base.push(dayObj); }
                dayObj.pairs.push({
                    id: ep.id, num: parseInt(ep.num),
                    time: timeSlots[parseInt(ep.num)-1].start + '-' + timeSlots[parseInt(ep.num)-1].end,
                    subj: ep.subj, type: ep.type, map: ep.map, isCustom: true
                });
            });

            base.forEach(d => {
                d.pairs = d.pairs.filter(p => !window.appState.hiddenSchedule.some(hp => {
                    if (hp.weekType !== weekType || hp.day !== d.day || hp.num != p.num || hp.subj !== p.subj) return false;
                    return !hp.targetWeekNum || (weekNum && parseInt(hp.targetWeekNum) === parseInt(weekNum));
                }));
            });

            base = base.filter(d => d.pairs.length > 0);
            base.forEach(d => d.pairs.sort((a,b) => a.num - b.num));
            base.sort((a,b) => dayOffsets[a.day] - dayOffsets[b.day]);
            return base;
        };

                const electives = window.appState.selectedStudent.electives || [];
                pairs = pairs.filter(p => p.type === 'general' || p.type === 'lang' || electives.some(el => p.subj.toLowerCase().includes(el.toLowerCase())));

            const todayName = ['Неділя','Понеділок','Вівторок','Середа','Четвер',"П'ятниця",'Субота'][now.getDay()];

            return pairs.some(p => dayOffsets[p.day] > (now.getDay() === 0 ? 6 : now.getDay()-1) || (p.day === todayName && p.time.split('-')[1] >= time));

        const captureNavIndicator = (container) => {
            if (!container) return null;
            const pill = container.querySelector('.nav-liquid-indicator');
            const active = container.querySelector('.nav-active');
            if (!pill || !active) return null;
            const c = container.getBoundingClientRect();
            const b = active.getBoundingClientRect();
            return {
                left: b.left - c.left,
                top: b.top - c.top,
                width: b.width,
                height: b.height
            };
        };

        const ensureNavIndicator = (container) => {
            if (!container) return null;

                container.appendChild(pill);
            }
            return pill;
        };

        const positionNavIndicator = (container, box, immediate = false) => {
            if (!container || !box) return;
            const pill = ensureNavIndicator(container);
            if (!pill) return;
            if (immediate) pill.style.transition = 'none';
            else pill.style.removeProperty('transition');
            pill.style.left = `${box.left}px`;
            pill.style.top = `${box.top}px`;
            pill.style.width = `${box.width}px`;
            pill.style.height = `${box.height}px`;
            pill.style.borderRadius = `${Math.min(22, box.height / 2)}px`;
            pill.style.opacity = '1';
            if (immediate) {
                void pill.offsetWidth;
                pill.style.removeProperty('transition');
            }
        };

        const animateActiveNav = (container, fromBox = null) => {

                if (pill) pill.style.opacity = '0';
                return;
            }

            const b = active.getBoundingClientRect();
            const target = { left: b.left - c.left, top: b.top - c.top, width: b.width, height: b.height };

            if (!fromBox) {
                positionNavIndicator(container, target, true);
            } else {
                positionNavIndicator(container, fromBox, true);
                requestAnimationFrame(() => {
                    pill.style.removeProperty('transition');
                    pill.classList.remove('is-moving');

        const renderAnalytics = () => {

            let html = `
                <div>

                                <span class="text-[10px] md:text-[11px] font-black text-zinc-500 uppercase tracking-widest leading-tight">Унікальні<br class="hidden md:block">(${selDate === todayStr ? 'сьогодні' : 'за день'})</span>

                            <div class="absolute -right-4 -top-4 w-20 h-20 bg-emerald-500/10 rounded-full blur-2xl"></div>
                            <div class="flex items-center gap-2 md:gap-3 mb-3">
                                <div class="w-10 h-10 md:w-12 md:h-12 rounded-[12px] md:rounded-[14px] bg-emerald-50 dark:bg-emerald-500/10 text-emerald-500 flex items-center justify-center"><i data-lucide="activity" class="w-5 h-5 md:w-6 md:h-6"></i></div>
                                <span class="text-[10px] md:text-[11px] font-black text-zinc-500 uppercase tracking-widest leading-tight">Зараз<br class="hidden md:block">онлайн</span>

                            <div class="text-4xl md:text-5xl font-black text-zinc-900 dark:text-white tracking-tight mt-1" id="stat-online">-</div>

                        <div class="glass-card p-5 md:p-6 rounded-[24px] md:rounded-[28px] flex flex-col justify-center relative overflow-hidden animate-scale-in" style="animation-delay: 150ms;">
                            <div class="absolute -right-4 -top-4 w-20 h-20 bg-purple-500/10 rounded-full blur-2xl"></div>
                            <div class="flex items-center gap-2 md:gap-3 mb-3">
                                <div class="w-10 h-10 md:w-12 md:h-12 rounded-[12px] md:rounded-[14px] bg-purple-50 dark:bg-purple-500/10 text-purple-500 flex items-center justify-center"><i data-lucide="zap" class="w-5 h-5 md:w-6 md:h-6"></i></div>
                                <span class="text-[10px] md:text-[11px] font-black text-zinc-500 uppercase tracking-widest leading-tight">Сесій<br class="hidden md:block">за день</span>
                            </div>
                            <div class="text-4xl md:text-5xl font-black text-zinc-900 dark:text-white tracking-tight mt-1" id="stat-sessions">-</div>

                        <div class="glass-card p-5 md:p-6 rounded-[24px] md:rounded-[28px] flex flex-col justify-center relative overflow-hidden animate-scale-in" style="animation-delay: 200ms;">
                            <div class="absolute -right-4 -top-4 w-20 h-20 bg-amber-500/10 rounded-full blur-2xl"></div>
                            <div class="flex items-center gap-2 md:gap-3 mb-3">
                                <div class="w-10 h-10 md:w-12 md:h-12 rounded-[12px] md:rounded-[14px] bg-amber-50 dark:bg-amber-500/10 text-amber-500 flex items-center justify-center"><i data-lucide="clock" class="w-5 h-5 md:w-6 md:h-6"></i></div>
                                <span class="text-[10px] md:text-[11px] font-black text-zinc-500 uppercase tracking-widest leading-tight">Сер. час<br class="hidden md:block">сесії</span>
                            </div>
                            <div class="text-4xl md:text-5xl font-black text-zinc-900 dark:text-white tracking-tight mt-1"><span id="stat-avg">-</span> <span class="text-sm md:text-base font-bold text-zinc-400">хв</span></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8 relative z-10 animate-slide-up" style="animation-delay: 250ms;">
                        
                        <div class="lg:col-span-1 flex flex-col gap-3 md:gap-4">
                            <h3 class="text-[16px] md:text-[18px] font-black text-zinc-900 dark:text-white ml-2 flex items-center gap-2"><i data-lucide="users" class="w-5 h-5 text-zinc-500"></i> Відвідувачі за день</h3>
                            <div class="glass-panel overflow-hidden rounded-[28px] md:rounded-[36px] flex-1 max-h-[60vh] flex flex-col">
                                <div class="overflow-y-auto hide-scrollbar p-4 md:p-5 space-y-2.5" id="analytics-users-list">
                                    <!-- Dynamic Content -->
                                </div>
                            </div>
                        </div>

                        <div class="lg:col-span-2 flex flex-col gap-3 md:gap-4">
                            <h3 class="text-[16px] md:text-[18px] font-black text-zinc-900 dark:text-white ml-2 flex items-center gap-2"><i data-lucide="list" class="w-5 h-5 text-zinc-500"></i> Детальний журнал сесій</h3>
                            <div class="glass-panel overflow-hidden rounded-[28px] md:rounded-[36px] flex-1">
                                <div class="overflow-x-auto hide-scrollbar max-h-[60vh]" id="analytics-sessions-scroll">
                                    <table class="w-full text-left border-collapse min-w-[500px]">
                                        <thead class="bg-white/60 dark:bg-black/40 text-[10px] md:text-[11px] font-black uppercase tracking-widest text-zinc-500 sticky top-0 z-20 backdrop-blur-xl border-b border-zinc-200/80 dark:border-white/10">
                                            <tr>
                                                <th class="py-4 md:py-5 px-5 md:px-6">Студент</th>
                                                <th class="py-4 md:py-5 px-5 md:px-6">Пристрій</th>
                                                <th class="py-4 md:py-5 px-5 md:px-6">Вхід</th>
                                                <th class="py-4 md:py-5 px-5 md:px-6">Активність</th>
                                                <th class="py-4 md:py-5 px-5 md:px-6 text-right">Час сесії</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-zinc-200/80 dark:divide-white/10" id="analytics-sessions-list">

                    </div>
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
            window.app.updateAnalyticsDOM(true);
        };

        window.app = {
            setView: (viewId) => {
                const content = document.getElementById('main-content');
                if (!viewId || !content) return;

                const currentView = window.appState.view;
                if (currentView === viewId) {
                    if (viewId === 'schedule' || viewId === 'main') {
                        const isPers = viewId === 'schedule';
                        const activeWeekType = isPers ? window.appState.persMainWeek : window.appState.mainViewWeek;
                        const activeWeekNum = isPers ? window.appState.persActiveWeekNum : window.appState.mainActiveWeekNum;
                        window.app.scrollToActivePair(getMergedSchedule(activeWeekType, activeWeekNum), isPers);
                    }
                    return;
                }

                if (viewId === 'schedule' || viewId === 'main') {
                    window.appState.shouldScrollToPair = true;
                }
                if (viewId === 'homework') {
                    window.appState.unreadHwCount = 0;
                }

                const order = ['dashboard','schedule','homework','register','analytics','materials','editor'];
                const from = Math.max(0, order.indexOf(currentView));
                const to = Math.max(0, order.indexOf(viewId));
                const direction = to >= from ? 1 : -1;
                const token = ++window.appState.viewTransitionToken;

                content.dataset.transitionDirection = direction > 0 ? 'forward' : 'back';
                window.clearTimeout(window.appState.viewTransitionTimer);

                content.classList.remove('view-enter');
                content.classList.add('view-leave');

                window.appState.viewTransitionTimer = window.setTimeout(() => {
                    if (token !== window.appState.viewTransitionToken) return;

                    window.appState.view = viewId;
                    window.appState.navSignature = '';
                    window.app.renderActiveView();
                    window.scrollTo({ top: 0, behavior: 'auto' });

                    requestAnimationFrame(() => {
                        if (token !== window.appState.viewTransitionToken) return;
                        content.classList.remove('view-leave');
                        content.classList.add('view-enter');
                        window.setTimeout(() => {
                            if (token === window.appState.viewTransitionToken) {
                                content.classList.remove('view-enter');
                            }
                        }, 520);
                    });
                }, 175);
            },

            attachScrollDrag: () => {
                const containers = document.querySelectorAll('.hide-scrollbar');
                containers.forEach(el => {
                    if(el.dataset.dragAttached) return; 
                    el.dataset.dragAttached = 'true';
                    
                    if (!el.classList.contains('overflow-x-auto') && el.tagName !== 'TABLE') return;

                    el.classList.add('cursor-grab');

                    let isDown = false;
                    let isDragging = false;
                    let startX;
                    let scrollLeft;

                    el.addEventListener('mousedown', (e) => {
                        isDown = true;
                        isDragging = false;
                        el.classList.remove('cursor-grab');
                        el.style.cursor = 'grabbing';
                        el.style.scrollBehavior = 'auto';
                        el.style.scrollSnapType = 'none';
                        startX = e.pageX - el.offsetLeft;
                        scrollLeft = el.scrollLeft;
                    });

                    const stopDrag = () => {
                        if(!isDown) return;
                        isDown = false;
                        el.style.cursor = '';
                        el.classList.add('cursor-grab');
                        el.style.scrollBehavior = 'smooth';
                        el.style.scrollSnapType = '';
                        setTimeout(() => { isDragging = false; }, 50);
                    };

                    el.addEventListener('mouseleave', stopDrag);
                    el.addEventListener('mouseup', stopDrag);

                    el.addEventListener('mousemove', (e) => {
                        if (!isDown) return;
                        e.preventDefault();
                        const x = e.pageX - el.offsetLeft;
                        const walk = (x - startX) * 1.5; 
                        if (Math.abs(walk) > 10) isDragging = true;
                        el.scrollLeft = scrollLeft - walk;
                    });

                    el.addEventListener('click', (e) => {
                        if (isDragging) {
                            e.preventDefault();
                            e.stopPropagation();
                        }
                    }, { capture: true });

                    el.addEventListener('wheel', (e) => {
                        if (e.deltaY !== 0 && Math.abs(e.deltaX) < Math.abs(e.deltaY)) {
                            const canScrollRight = el.scrollLeft < el.scrollWidth - el.clientWidth - 1;
                            const canScrollLeft = el.scrollLeft > 0;
                            
                            if ((e.deltaY > 0 && canScrollRight) || (e.deltaY < 0 && canScrollLeft)) {
                                e.preventDefault();
                                el.style.scrollBehavior = 'auto';
                                el.style.scrollSnapType = 'none';
                                el.scrollLeft += e.deltaY;
                                
                                clearTimeout(el.wheelTimeout);
                                el.wheelTimeout = setTimeout(() => {
                                    el.style.scrollBehavior = 'smooth';
                                    el.style.scrollSnapType = '';
                                }, 150);
                            }
                        }
                    }, { passive: false });
                });
            },

            scrollToActivePair: (scheduleList, isPersonal) => {
                if (!scheduleList || scheduleList.length === 0) return;
                const now = new Date();
                const daysMap = {0:"Неділя", 1:"Понеділок", 2:"Вівторок", 3:"Середа", 4:"Четвер", 5:"П'ятниця", 6:"Субота"};
                const todayStr = daysMap[now.getDay()];
                const currentTime = now.toTimeString().slice(0,5);
                const currentDayNum = now.getDay() === 0 ? 7 : now.getDay(); 

                let targetId = null;
                let isCurrentLive = false;
                const user = window.appState.selectedStudent;

                let todayPairs = scheduleList.find(d => d.day === todayStr)?.pairs || [];
                if (isPersonal) {
                    todayPairs = todayPairs.filter(p => ['general', 'lang'].includes(p.type) || user.electives.some(el => p.subj.toLowerCase().includes(el.toLowerCase())));
                }

                if (todayPairs.length > 0) {
                    for (let p of todayPairs) {
                        const [start, end] = p.time.split('-');
                        if (currentTime <= end) {
                            targetId = `pair-${dayOffsets[todayStr]}-${p.num}`;
                            if (currentTime >= start && currentTime <= end) isCurrentLive = true;
                            break;
                        }
                    }
                }

                if (!targetId) {
                    const sortedDays = scheduleList.map(d => {
                        let dNum = dayOffsets[d.day] + 1; 
                        let diff = dNum - currentDayNum;
                        if (diff <= 0) diff += 7; 
                        return { ...d, diff };
                    }).sort((a,b) => a.diff - b.diff);

                    if (sortedDays.length > 0) {
                        const nextDay = sortedDays[0];
                        let nextPairs = nextDay.pairs;
                        if (isPersonal) {
                            nextPairs = nextPairs.filter(p => ['general', 'lang'].includes(p.type) || user.electives.some(el => p.subj.toLowerCase().includes(el.toLowerCase())));
                        }
                        
                        if (nextPairs.length > 0) {
                            targetId = `pair-${dayOffsets[nextDay.day]}-${nextPairs[0].num}`;
                        }
                    }
                }

                if (targetId) {
                    const el = document.getElementById(targetId);
                    if (el) {
                        const headerOffset = window.innerWidth < 768 ? 140 : 100;
                        const y = el.getBoundingClientRect().top + window.scrollY - headerOffset;
                        window.scrollTo({ top: y, behavior: 'smooth' });

                        const { pri } = getTheme();
                        el.classList.add('ring-4', `ring-${pri}-500/60`, 'scale-[1.02]');
                        
                        if (isCurrentLive) {
                            el.classList.add('animate-pulse');
                            setTimeout(() => {
                                el.classList.remove('animate-pulse');
                                setTimeout(() => el.classList.remove('ring-4', `ring-${pri}-500/60`, 'scale-[1.02]'), 1500);
                            }, 3000);
                        } else {
                            setTimeout(() => el.classList.remove('ring-4', `ring-${pri}-500/60`, 'scale-[1.02]'), 2000);
                        }
                    }
                }
            },

            renderActiveView: () => {
                if(!window.appState.selectedStudent) return;
                renderNav();
                const v = window.appState.view;
                if(v === 'dashboard') renderDashboard();
                else if(v === 'schedule') renderSchedule(true);
                else if(v === 'main') renderSchedule(false);
                else if(v === 'materials') renderMaterials();
                else if(v === 'homework') renderHomework();
                else if(v === 'register') renderRegister();
                else if(v === 'editor') renderEditor();
                else if(v === 'analytics') renderAnalytics();
                
                lucide.createIcons();
                window.app.attachScrollDrag();
            },

            updateAnalyticsDOM: (isInitial = false) => {
                if (window.appState.view !== 'analytics') return;
                const { pri } = getTheme();
                const logs = window.appState.analyticsData;
                
                const getLogDateStr = (ts) => {
                    const d = new Date(ts);
                    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                };
                
                const todayStr = getLogDateStr(Date.now());
                const availableDates = [...new Set(logs.map(l => getLogDateStr(l.start)))].sort((a,b) => b.localeCompare(a));
                if (!availableDates.includes(todayStr)) availableDates.unshift(todayStr);

                const selDate = window.appState.analyticsDate || availableDates[0];
                const dailyLogs = logs.filter(l => getLogDateStr(l.start) === selDate);

                const uniqueUsers = new Set(dailyLogs.map(l => l.studentId)).size;
                const totalSessions = dailyLogs.length;
                const activeNow = logs.filter(l => (Date.now() - l.end) < 15000).length;
                
                let totalDur = 0;
                dailyLogs.forEach(l => { totalDur += (l.end - l.start); });
                const avgDurMins = totalSessions > 0 ? Math.round((totalDur / totalSessions) / 60000) : 0;

                const userStatsMap = {};
                dailyLogs.forEach(l => {
                    if(!userStatsMap[l.studentId]) userStatsMap[l.studentId] = { name: l.name, count: 0, totalDur: 0 };
                    userStatsMap[l.studentId].count++;
                    userStatsMap[l.studentId].totalDur += (l.end - l.start);
                });
                const groupedUsers = Object.values(userStatsMap).sort((a,b) => b.count - a.count);

                const elUnique = document.getElementById('stat-unique');
                const elOnline = document.getElementById('stat-online');
                const elSessions = document.getElementById('stat-sessions');
                const elAvg = document.getElementById('stat-avg');
                
                if (elUnique) elUnique.innerText = uniqueUsers;
                if (elOnline) elOnline.innerText = activeNow;
                if (elSessions) elSessions.innerText = totalSessions;
                if (elAvg) elAvg.innerText = avgDurMins;

                const usersList = document.getElementById('analytics-users-list');
                const sessionsList = document.getElementById('analytics-sessions-list');
                const sessionsScrollWrapper = document.getElementById('analytics-sessions-scroll');
                
                let usersScroll = usersList ? usersList.scrollTop : 0;
                let sessionsScroll = sessionsScrollWrapper ? sessionsScrollWrapper.scrollTop : 0;

                let usersHtml = groupedUsers.length === 0 ? `<div class="text-center py-8 text-sm font-bold text-zinc-500">Немає активності за цей день.</div>` : 
                    groupedUsers.map((u, i) => {
                        const mins = Math.round(u.totalDur / 60000);
                        return `
                            <div class="p-3.5 md:p-4 rounded-[20px] md:rounded-[24px] bg-white/60 dark:bg-black/30 border border-zinc-200/80 dark:border-white/5 flex items-center justify-between shadow-sm ${isInitial ? 'animate-slide-in-right' : ''}" ${isInitial ? `style="animation-delay: ${50 + i * 20}ms;"` : ''}>
                                <div class="flex items-center gap-3 overflow-hidden pr-2">
                                    <div class="w-10 h-10 md:w-12 md:h-12 rounded-[14px] md:rounded-[16px] bg-zinc-200 dark:bg-zinc-800 flex items-center justify-center text-[13px] md:text-[15px] text-zinc-600 dark:text-zinc-300 font-black shrink-0 shadow-inner border border-zinc-300 dark:border-zinc-700">${u.name.charAt(0)}</div>
                                    <div class="truncate">
                                        <div class="font-bold text-[13px] md:text-[14px] text-zinc-900 dark:text-white truncate" title="${u.name}">${u.name.split(' ')[0]} ${u.name.split(' ')[1] || ''}</div>
                                        <div class="text-[11px] md:text-[12px] font-semibold text-zinc-500 mt-1 whitespace-nowrap">Час: ${mins < 1 ? '<1' : mins} хв</div>
                                    </div>
                                </div>
                                <div class="shrink-0 flex items-center gap-1.5 min-w-[36px] justify-center h-8 md:h-9 px-2.5 md:px-3 rounded-[10px] md:rounded-[12px] bg-${pri}-50 text-${pri}-600 dark:bg-${pri}-500/10 dark:text-${pri}-400 font-black text-[12px] md:text-[14px] border border-${pri}-100 dark:border-${pri}-500/20 shadow-sm" title="Кількість входів">
                                    ${u.count} <i data-lucide="log-in" class="w-3.5 md:w-4 h-3.5 md:h-4 opacity-70"></i>
                                </div>
                            </div>

            updateLiveWidget: () => {
                if (window.appState.view !== 'dashboard') return;

                const now = new Date();
                const dayNames = ['Неділя','Понеділок','Вівторок','Середа','Четвер',"П'ятниця",'Субота'];
                const curDay = dayNames[now.getDay()];
                const currentTime = now.toTimeString().slice(0,5);
                const week = getClosestMainWeek();
                let pairs = getMergedSchedule(week.t, week.n).flatMap(d => d.pairs.map(p => ({...p, day:d.day})));
                const user = window.appState.selectedStudent;
                pairs = pairs.filter(p => p.type === 'general' || p.type === 'lang' || (user?.electives || []).some(el => p.subj.toLowerCase().includes(el.toLowerCase())));
                const todayPairs = pairs.filter(p => p.day === curDay).sort((a,b) => a.num-b.num);
                let cur = todayPairs.find(p => currentTime >= p.time.split('-')[0] && currentTime <= p.time.split('-')[1]);
                let nxt = todayPairs.find(p => currentTime < p.time.split('-')[0]);
                if (!nxt && !cur) {
                    const next = pairs.find(p => dayOffsets[p.day] > ((now.getDay()===0?6:now.getDay()-1)));
                    nxt = next || null;
                }

                let status;
                if (cur) {

            },
            _doDeleteExtra: (id) => { removeFromCloud('extra_schedule', id, () => {}); },
            
            _doHideSubj: (subj, weekType, day, num, targetWeekNum) => {
                const parsedTargetWeek = (targetWeekNum && targetWeekNum !== 'null') ? parseInt(targetWeekNum) : null;
                const docId = Date.now().toString();
                const newHidden = { id: docId, weekType, day, num: parseInt(num), subj, author: window.appState.selectedStudent.name, targetWeekNum: parsedTargetWeek };
                writeToCloud('hidden_schedule', docId, newHidden, () => {});
            },

            addExtraSchedule: () => {
                const edWeek = document.getElementById('ed-week').value;
                const edDay = document.getElementById('ed-day').value;
                const edNum = document.getElementById('ed-num').value;
                const edSubjRaw = document.getElementById('ed-subj').value;
                const targetWeekNum = document.getElementById('ed-target-week').value || null;
                const [subj, type, map] = edSubjRaw.split('|');

                const docId = Date.now().toString();
                const newPair = { id: docId, weekType: edWeek, day: edDay, num: parseInt(edNum), subj, type, map, author: window.appState.selectedStudent.name, targetWeekNum: targetWeekNum ? parseInt(targetWeekNum) : null };
                
                writeToCloud('extra_schedule', docId, newPair, () => {});
            },

            deleteExtraSchedule: (id) => { window.app.openConfirmModal("Видалити пару?", "Вона назавжди зникне.", `window.app._doDeleteExtra('${id}')`); },

            restoreHiddenSchedule: (id) => { window.app.openConfirmModal("Відновити пару?", "Пара знову з'явиться в розкладі.", `window.app._doRestoreHidden('${id}')`); },
            _doRestoreHidden: (id) => { removeFromCloud('hidden_schedule', id, () => {}); }
        };

        const initRemoteServices = () => {
            // Firebase/auth is deliberately non-blocking: the portal UI must work even when
            // Firebase is slow/offline. Local storage provides the immediate first paint.
            let authReady = false;
            const bindSnapshots = () => {
                if (authReady) return;
                authReady = true;
                onAuthStateChanged(auth, (user) => {
                    window.appState.firebaseUser = user;
                    if (!user) return;

                    onSnapshot(
                        collection(db, 'artifacts', appId, 'public', 'data', 'zoom_links'),
                        (snap) => {
                            const links = {};
                            snap.forEach(doc => links[doc.id] = doc.data());
                            window.appState.locationsData = links;
                            localStorage.setItem('portal-custom-locations', JSON.stringify(links));
                            if (['schedule', 'main', 'dashboard'].includes(window.appState.view)) window.app.renderActiveView();
                        },
                        (error) => console.error('Locations error:', error)
                    );

                    onSnapshot(
                        collection(db, 'artifacts', appId, 'public', 'data', 'homeworks'),
                        (snap) => {
                            const newHwList = [];
                            snap.forEach(doc => newHwList.push({ id: doc.id, ...doc.data() }));
                            newHwList.sort((a, b) => Number(b.id) - Number(a.id));
                            if (window.appState.homeworks.length > 0 && window.appState.selectedStudent) {
                                const oldIds = new Set(window.appState.homeworks.map(h => h.id));
                                newHwList.filter(h => !oldIds.has(h.id)).forEach(newDoc => {
                                    if (newDoc.author !== window.appState.selectedStudent.name && isHwRelevant(newDoc.subj, window.appState.selectedStudent)) {
                                        window.appState.unreadHwCount++;
                                    }
                                });
                            }
                            window.appState.homeworks = newHwList;
                            localStorage.setItem('portal-homeworks', JSON.stringify(newHwList));
                            if (['homework', 'dashboard', 'schedule', 'main'].includes(window.appState.view)) window.app.renderActiveView();
                            else if (window.appState.selectedStudent) renderNav();
                        },
                        (error) => console.error('Homeworks error:', error)
                    );

                    onSnapshot(
                        collection(db, 'artifacts', appId, 'public', 'data', 'materials'),
                        (snap) => {
                            const mat = [];
                            snap.forEach(doc => mat.push(doc.data()));
                            mat.sort((a, b) => Number(b.id) - Number(a.id));
                            window.appState.materials = mat;
                            localStorage.setItem('portal-materials', JSON.stringify(mat));
                            if (['materials', 'dashboard'].includes(window.appState.view)) window.app.renderActiveView();
                        },
                        (error) => console.error('Materials error:', error)
                    );

                    onSnapshot(
                        collection(db, 'artifacts', appId, 'public', 'data', 'extra_schedule'),
                        (snap) => {
                            const extra = [];
                            snap.forEach(doc => extra.push({ id: doc.id, ...doc.data() }));
                            window.appState.extraSchedule = extra;
                            localStorage.setItem('portal-extra-schedule', JSON.stringify(extra));
                            if (['schedule', 'main', 'editor', 'dashboard'].includes(window.appState.view)) window.app.renderActiveView();
                        },
                        (error) => console.error('Extra schedule error:', error)
                    );

                    onSnapshot(
                        collection(db, 'artifacts', appId, 'public', 'data', 'hidden_schedule'),
                        (snap) => {
                            const hidden = [];
                            snap.forEach(doc => hidden.push({ id: doc.id, ...doc.data() }));
                            window.appState.hiddenSchedule = hidden;
                            localStorage.setItem('portal-hidden-schedule', JSON.stringify(hidden));
                            if (['schedule', 'main', 'editor', 'dashboard'].includes(window.appState.view)) window.app.renderActiveView();
                        },
                        (error) => console.error('Hidden schedule error:', error)
                    );

                    window.app.initAnalyticsListener();
                });
            };

            const connect = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (err) {
                    console.warn('Firebase unavailable; continuing in offline/local mode.', err);
                } finally {
                    bindSnapshots();
                }
            };

            // Never let authentication block the page for more than 3500 ms.
            const timeoutId = window.setTimeout(() => bindSnapshots(), 3500);
            connect().finally(() => window.clearTimeout(timeoutId));
        };

        let navIndicatorResizeRaf = 0;
        const refreshNavIndicators = () => {
            if (navIndicatorResizeRaf) return;
            navIndicatorResizeRaf = requestAnimationFrame(() => {
                navIndicatorResizeRaf = 0;
                animateActiveNav(document.getElementById('desktop-nav'));
                animateActiveNav(document.getElementById('mobile-nav'));
            });
        };
        window.addEventListener('resize', refreshNavIndicators, { passive: true });
        window.addEventListener('orientationchange', refreshNavIndicators, { passive: true });

        const initApp = () => {
            // Paint local UI first. Remote services are started afterwards.
            try { initInteractiveBackground(); } catch (e) { console.warn('Interactive background disabled:', e); }

            if (window.appState.isDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');

            try { window.app.setColorTheme(window.appState.colorTheme, true); } catch (e) { console.warn('Theme init warning:', e); }
            try { applyBackgroundTheme(); } catch (e) { console.warn('Background init warning:', e); }

            const savedId = readRememberedStudentId();
            if (savedId) {
                document.getElementById('auth-screen')?.classList.add('hidden');
                const s = students.find(x => x.id === Number(savedId));
                if (s) {
                    window.appState.selectedStudent = s;
                    rememberStudentOnDevice(s);
                    document.getElementById('auth-screen')?.classList.add('hidden');
                    document.getElementById('app')?.classList.remove('hidden');
                    try { window.app.renderActiveView(); } catch (e) { console.error('Initial render failed:', e); }
                    try { window.app.startAnalyticsSession(); } catch (e) {}
                }
            } else {
                document.getElementById('auth-screen')?.classList.remove('hidden');
                try { window.app.renderAuthList(); } catch (e) { console.error('Auth render failed:', e); }
                try { if (window.lucide?.createIcons) lucide.createIcons(); } catch (e) {}
            }

            // Start Firebase after first paint.
            try { initRemoteServices(); } catch (e) { console.warn('Remote services unavailable:', e); }
        };


        // Pause non-essential analytics traffic while the tab is hidden.
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (window.appState.analyticsInterval) {
                    clearInterval(window.appState.analyticsInterval);
                    window.appState.analyticsInterval = null;
                }
            } else if (window.appState.selectedStudent && window.appState.firebaseUser) {
                try { window.app.startAnalyticsSession(); } catch (e) {}
            }
        });

        // Lightweight interactive background. Pointer input is sampled and smoothed
        // once per animation frame; only CSS transforms are updated.
        const initInteractiveBackground = () => {
            const root = document.getElementById('ambient-background');
            if (!root) return;
            const reduce = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
            const fine = window.matchMedia?.('(pointer: fine)').matches;
            const coarse = window.matchMedia?.('(pointer: coarse)').matches;
            if (reduce) return;

            let targetX = 0, targetY = 0;
            let currentX = 0, currentY = 0;
            let raf = 0;
            let active = !document.hidden;

            const write = () => {
                raf = 0;
                if (!active) return;
                currentX += (targetX - currentX) * (fine ? 0.12 : 0.09);
                currentY += (targetY - currentY) * (fine ? 0.12 : 0.09);
                root.style.setProperty('--pointer-rx', currentX.toFixed(4));
                root.style.setProperty('--pointer-ry', currentY.toFixed(4));
                if (Math.abs(targetX-currentX) > 0.001 || Math.abs(targetY-currentY) > 0.001) {
                    raf = requestAnimationFrame(write);
                }
            };
            const schedule = () => { if (!raf && active) raf = requestAnimationFrame(write); };

            const setFromPoint = (clientX, clientY, strength) => {
                const w = window.innerWidth || 1;
                const h = window.innerHeight || 1;
                targetX = ((clientX / w) - 0.5) * 2 * strength;
                targetY = ((clientY / h) - 0.5) * 2 * strength;
                schedule();
            };

            if (fine) {
                window.addEventListener('pointermove', (e) => setFromPoint(e.clientX, e.clientY, 1), {passive:true});
                window.addEventListener('pointerout', (e) => {
                    if (e.relatedTarget) return;
                    targetX = targetY = 0;
                    schedule();
                }, {passive:true});
            } else if (coarse) {
                window.addEventListener('touchmove', (e) => {
                    const t = e.touches?.[0];
                    if (t) setFromPoint(t.clientX, t.clientY, 0.42);
                }, {passive:true});
                window.addEventListener('touchend', () => { targetX = targetY = 0; schedule(); }, {passive:true});
                window.addEventListener('touchcancel', () => { targetX = targetY = 0; schedule(); }, {passive:true});
            }

            document.addEventListener('visibilitychange', () => {
                active = !document.hidden;
                if (!active) {
                    if (raf) cancelAnimationFrame(raf);
                    raf = 0;
                } else {
                    schedule();
                }
            }, {passive:true});

            window.addEventListener('resize', schedule, {passive:true});
            schedule();
        };

        // Premium pointer spotlight — disabled on touch/reduced-motion devices.
        (() => {
            const glow = document.getElementById('pointer-glow');
            if (!glow) return;
            const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
            const touchDevice = window.matchMedia?.('(pointer: coarse)').matches;
            if (reduceMotion || touchDevice) return;

            let raf = 0;
            let x = 0, y = 0;

            window.addEventListener('pointermove', (e) => {
                x = e.clientX; y = e.clientY;
                if (raf) return;
                raf = requestAnimationFrame(() => {
                    glow.style.setProperty('--pointer-x', `${x}px`);
                    glow.style.setProperty('--pointer-y', `${y}px`);
                    raf = 0;
                });
            }, { passive: true });

            document.addEventListener('pointerleave', () => {
                glow.style.opacity = '0';
            });
            document.addEventListener('pointerenter', () => {
                glow.style.opacity = '';
            });
        })();

        // Run Init
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
