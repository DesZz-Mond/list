                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        slideInRight: {
                            '0%': { opacity: '0', transform: 'translateX(-20px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' }
                        },
                        scaleIn: {
                            '0%': { opacity: '0', transform: 'scale(0.92)' },
                            '100%': { opacity: '1', transform: 'scale(1)' }
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.85)' },
                            '60%': { opacity: '1', transform: 'scale(1.03)' },
                            '100%': { opacity: '1', transform: 'scale(1)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0) scale(1)' },
                            '50%': { transform: 'translateY(-15px) scale(1.05)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: 0.5, transform: 'scale(1)' },
                            '50%': { opacity: 0.8, transform: 'scale(1.1)' }
                        }
                    },
                    animation: {
                        'slide-up': 'slideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both',
                        'slide-in-right': 'slideInRight 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both',

                }

        // --- INTERACTIVE BACKGROUND ENGINE ---
        const initParticles = () => {
            const canvas = document.getElementById('interactive-bg');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height, particles = [];
            
            const particleCount = window.innerWidth < 768 ? 40 : 80;
            const connectionDistance = 120;
            const mouseAttractionRadius = 150;

            let mouse = { x: null, y: null };
            window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
            window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });

            const resize = () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            };
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 1.5;
                    this.vy = (Math.random() - 0.5) * 1.5;
                    this.size = Math.random() * 2 + 1;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;

                    if (mouse.x) {
                        const dx = mouse.x - this.x;
                        const dy = mouse.y - this.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < mouseAttractionRadius) {
                            this.x += dx * 0.025;
                            this.y += dy * 0.025;
                        }
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    const isDark = window.appState.isDark;
                    ctx.fillStyle = isDark ? 'rgba(255, 255, 255, 0.4)' : 'rgba(0, 0, 0, 0.15)';
                    ctx.fill();
                }
            }

            for (let i = 0; i < particleCount; i++) particles.push(new Particle());

            const animate = () => {
                ctx.clearRect(0, 0, width, height);
                const isDark = window.appState.isDark;
                const lineColor = isDark ? '255, 255, 255' : '0, 0, 0';

                particles.forEach((p, index) => {
                    p.update();
                    p.draw();
                    
                    for (let j = index + 1; j < particles.length; j++) {
                        const p2 = particles[j];
                        const dx = p.x - p2.x;
                        const dy = p.y - p2.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < connectionDistance) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            const opacity = 1 - (distance / connectionDistance);
                            ctx.strokeStyle = `rgba(${lineColor}, ${opacity * 0.15})`;
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }
                });
                requestAnimationFrame(animate);
            };
            animate();
        };

                                <span class="text-[10px] md:text-[11px] font-black text-zinc-500 uppercase tracking-widest leading-tight">Сер. час<br class="hidden md:block">сесії</span>

                            <div class="text-4xl md:text-5xl font-black text-zinc-900 dark:text-white tracking-tight mt-1"><span id="stat-avg">-</span> <span class="text-sm md:text-base font-bold text-zinc-400">хв</span></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8 relative z-10 animate-slide-up" style="animation-delay: 250ms;">
                        
                        <div class="lg:col-span-1 flex flex-col gap-3 md:gap-4">

                            <div class="glass-panel overflow-hidden rounded-[28px] md:rounded-[36px] flex-1 max-h-[60vh] flex flex-col">
                                <div class="overflow-y-auto hide-scrollbar p-4 md:p-5 space-y-2.5" id="analytics-users-list">
                                    <!-- Dynamic Content -->
                                </div>
                            </div>
                        </div>

                        <div class="lg:col-span-2 flex flex-col gap-3 md:gap-4">
                            <h3 class="text-[16px] md:text-[18px] font-black text-zinc-900 dark:text-white ml-2 flex items-center gap-2"><i data-lucide="list" class="w-5 h-5 text-zinc-500"></i> Детальний журнал сесій</h3>
                            <div class="glass-panel overflow-hidden rounded-[28px] md:rounded-[36px] flex-1">
                                <div class="overflow-x-auto hide-scrollbar max-h-[60vh]" id="analytics-sessions-scroll">
                                    <table class="w-full text-left border-collapse min-w-[500px]">
                                        <thead class="bg-white/60 dark:bg-black/40 text-[10px] md:text-[11px] font-black uppercase tracking-widest text-zinc-500 sticky top-0 z-20 backdrop-blur-xl border-b border-zinc-200/80 dark:border-white/10">
                                            <tr>
                                                <th class="py-4 md:py-5 px-5 md:px-6">Студент</th>
                                                <th class="py-4 md:py-5 px-5 md:px-6">Пристрій</th>
                                                <th class="py-4 md:py-5 px-5 md:px-6">Вхід</th>

            document.getElementById('main-content').innerHTML = html;
            window.app.updateAnalyticsDOM(true);
        };

        // --- GLOBAL APP LOGIC EXPOSED TO WINDOW ---
        window.app = {
            setView: (viewId) => {
                if (window.appState.view === viewId) return;

                if (viewId === 'homework') {
                    window.appState.unreadHwCount = 0;
                    renderNav();
                }
                
                const content = document.getElementById('main-content');
                content.style.opacity = '0';
                content.style.transform = 'translateY(15px) scale(0.98)';
                
                setTimeout(() => {
                    window.appState.view = viewId;
                    window.app.renderActiveView();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    
                    content.style.opacity = '1';
                    content.style.transform = 'translateY(0) scale(1)';
                }, 250);
            },
            
            renderActiveView: () => {
                if(!window.appState.selectedStudent) return;
                renderNav();
                const v = window.appState.view;
                if(v === 'dashboard') renderDashboard();
                else if(v === 'schedule') renderSchedule(true);
                else if(v === 'main') renderSchedule(false);
                else if(v === 'materials') renderMaterials();
                else if(v === 'homework') renderHomework();
                else if(v === 'register') renderRegister();
                else if(v === 'editor') renderEditor();
                else if(v === 'analytics') renderAnalytics();
                
                lucide.createIcons();
            },

            updateAnalyticsDOM: (isInitial = false) => {
                if (window.appState.view !== 'analytics') return;
                const { pri } = getTheme();
                const logs = window.appState.analyticsData;
                
                const getLogDateStr = (ts) => {
                    const d = new Date(ts);
                    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                };
                
                const todayStr = getLogDateStr(Date.now());
                const availableDates = [...new Set(logs.map(l => getLogDateStr(l.start)))].sort((a,b) => b.localeCompare(a));
                if (!availableDates.includes(todayStr)) availableDates.unshift(todayStr);

                const selDate = window.appState.analyticsDate || availableDates[0];
                const dailyLogs = logs.filter(l => getLogDateStr(l.start) === selDate);

                const uniqueUsers = new Set(dailyLogs.map(l => l.studentId)).size;
                const totalSessions = dailyLogs.length;
                const activeNow = logs.filter(l => (Date.now() - l.end) < 15000).length;
                
                let totalDur = 0;
                dailyLogs.forEach(l => { totalDur += (l.end - l.start); });
                const avgDurMins = totalSessions > 0 ? Math.round((totalDur / totalSessions) / 60000) : 0;

                const userStatsMap = {};
                dailyLogs.forEach(l => {
                    if(!userStatsMap[l.studentId]) userStatsMap[l.studentId] = { name: l.name, count: 0, totalDur: 0 };
                    userStatsMap[l.studentId].count++;
                    userStatsMap[l.studentId].totalDur += (l.end - l.start);
                });
                const groupedUsers = Object.values(userStatsMap).sort((a,b) => b.count - a.count);

                const elUnique = document.getElementById('stat-unique');
                const elOnline = document.getElementById('stat-online');
                const elSessions = document.getElementById('stat-sessions');
                const elAvg = document.getElementById('stat-avg');
                
                if (elUnique) elUnique.innerText = uniqueUsers;
                if (elOnline) elOnline.innerText = activeNow;
                if (elSessions) elSessions.innerText = totalSessions;
                if (elAvg) elAvg.innerText = avgDurMins;

                const usersList = document.getElementById('analytics-users-list');
                const sessionsList = document.getElementById('analytics-sessions-list');
                const sessionsScrollWrapper = document.getElementById('analytics-sessions-scroll');
                
                let usersScroll = usersList ? usersList.scrollTop : 0;
                let sessionsScroll = sessionsScrollWrapper ? sessionsScrollWrapper.scrollTop : 0;

                let usersHtml = groupedUsers.length === 0 ? `<div class="text-center py-8 text-sm font-bold text-zinc-500">Немає активності за цей день.</div>` : 
                    groupedUsers.map((u, i) => {
                        const mins = Math.round(u.totalDur / 60000);
                        return `
                            <div class="p-3.5 md:p-4 rounded-[20px] md:rounded-[24px] bg-white/60 dark:bg-black/30 border border-zinc-200/80 dark:border-white/5 flex items-center justify-between shadow-sm ${isInitial ? 'animate-slide-in-right' : ''}" ${isInitial ? `style="animation-delay: ${50 + i * 20}ms;"` : ''}>
                                <div class="flex items-center gap-3 overflow-hidden pr-2">
                                    <div class="w-10 h-10 md:w-12 md:h-12 rounded-[14px] md:rounded-[16px] bg-zinc-200 dark:bg-zinc-800 flex items-center justify-center text-[13px] md:text-[15px] text-zinc-600 dark:text-zinc-300 font-black shrink-0 shadow-inner border border-zinc-300 dark:border-zinc-700">${u.name.charAt(0)}</div>
                                    <div class="truncate">
                                        <div class="font-bold text-[13px] md:text-[14px] text-zinc-900 dark:text-white truncate" title="${u.name}">${u.name.split(' ')[0]} ${u.name.split(' ')[1] || ''}</div>
                                        <div class="text-[11px] md:text-[12px] font-semibold text-zinc-500 mt-1 whitespace-nowrap">Час: ${mins < 1 ? '<1' : mins} хв</div>
                                    </div>
                                </div>
                                <div class="shrink-0 flex items-center gap-1.5 min-w-[36px] justify-center h-8 md:h-9 px-2.5 md:px-3 rounded-[10px] md:rounded-[12px] bg-${pri}-50 text-${pri}-600 dark:bg-${pri}-500/10 dark:text-${pri}-400 font-black text-[12px] md:text-[14px] border border-${pri}-100 dark:border-${pri}-500/20 shadow-sm" title="Кількість входів">
                                    ${u.count} <i data-lucide="log-in" class="w-3.5 md:w-4 h-3.5 md:h-4 opacity-70"></i>
                                </div>
                            </div>
                        `;
                    }).join('');

                let sessionsHtml = dailyLogs.length === 0 ? `<tr><td colspan="5" class="text-center py-8 text-sm font-bold text-zinc-500">Журнал порожній.</td></tr>` : 
                    dailyLogs.map((log, i) => {
                        const d1 = new Date(log.start);
                        const d2 = new Date(log.end);
                        const durMins = Math.round((log.end - log.start) / 60000);
                        const timeFmt = (d) => d.toLocaleTimeString('uk-UA', {hour: '2-digit', minute:'2-digit'});
                        
                        const isActiveNow = (Date.now() - log.end) < 15000;
                        
                        const dInfo = log.deviceInfo || { os: 'Невідомо', browser: 'Невідомо', device: 'Desktop' };
                        const devIcon = dInfo.device === 'Mobile' ? 'smartphone' : 'monitor';

                        return `
                            <tr class="transition-colors hover:bg-white/80 dark:hover:bg-white/10 ${isInitial ? 'animate-slide-in-right' : ''} ${isActiveNow ? 'bg-emerald-50/50 dark:bg-emerald-900/15' : ''}" ${isInitial ? `style="animation-delay: ${50 + i * 15}ms;"` : ''}>
                                <td class="py-4 md:py-5 px-5 md:px-6 font-bold text-[13px] md:text-[14px] text-zinc-900 dark:text-zinc-100 whitespace-nowrap">
                                    ${log.name}
                                </td>
                                <td class="py-4 md:py-5 px-5 md:px-6 whitespace-nowrap">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 md:w-9 md:h-9 rounded-full bg-zinc-100 dark:bg-white/5 flex items-center justify-center text-zinc-500 dark:text-zinc-400 border border-zinc-200 dark:border-white/5">
                                            <i data-lucide="${devIcon}" class="w-4 h-4"></i>
                                        </div>
                                        <div class="flex flex-col">
                                            <span class="text-[12px] md:text-[13px] text-zinc-900 dark:text-white font-bold tracking-tight">${dInfo.os}</span>
                                            <span class="text-[9px] md:text-[10px] font-semibold text-zinc-500 tracking-wide mt-0.5">${dInfo.browser}</span>
                                        </div>
                                    </div>
                                </td>
                                <td class="py-4 md:py-5 px-5 md:px-6 text-[13px] md:text-[14px] font-semibold text-zinc-600 dark:text-zinc-400 whitespace-nowrap">${timeFmt(d1)}</td>
                                <td class="py-4 md:py-5 px-5 md:px-6 text-[13px] md:text-[14px] font-semibold text-zinc-600 dark:text-zinc-400 whitespace-nowrap">
                                    ${isActiveNow ? `<span class="inline-flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-500/10 px-2.5 py-1.5 rounded-lg border border-emerald-100 dark:border-emerald-500/20 text-[11px] font-bold tracking-wide"><i data-lucide="activity" class="w-4 h-4"></i> Онлайн</span>` : `${timeFmt(d2)}`}
                                </td>
                                <td class="py-4 md:py-5 px-5 md:px-6 text-[13px] md:text-[14px] font-black text-right whitespace-nowrap ${durMins > 30 ? 'text-indigo-600 dark:text-indigo-400' : 'text-zinc-700 dark:text-zinc-300'}">
                                    ${durMins < 1 ? '< 1 хв' : durMins + ' хв'}
                                </td>
                            </tr>
                        `;
                    }).join('');

                if (usersList) {
                    usersList.innerHTML = usersHtml;
                    usersList.scrollTop = usersScroll;
                }
                if (sessionsList) {
                    sessionsList.innerHTML = sessionsHtml;
                    if (sessionsScrollWrapper) sessionsScrollWrapper.scrollTop = sessionsScroll;
                }
                
                if (!isInitial) {
                    lucide.createIcons({ root: usersList });
                    lucide.createIcons({ root: sessionsList });
                }
            },

            startAnalyticsSession: () => {
                if (window.appState.analyticsInterval) clearInterval(window.appState.analyticsInterval);
                const s = window.appState.selectedStudent;
                if (!s) return;
                
                const now = Date.now();
                const sessionId = `${s.id}_${now}`;
                window.appState.currentSessionId = sessionId;
                
                const devInfo = getDeviceInfo();
                
                const updateSession = async () => {
                    if(!window.appState.currentSessionId || !window.appState.firebaseUser) return;
                    try {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'analytics_logs', window.appState.currentSessionId), {
                            studentId: s.id,
                            name: s.name,
                            start: now,
                            end: Date.now(),
                            deviceInfo: devInfo
                        }, { merge: true });
                    } catch(e) {}
                };
                
                updateSession(); 
                window.appState.analyticsInterval = setInterval(updateSession, 5000); 
            },

            stopAnalyticsSession: () => {
                if (window.appState.analyticsInterval) {
                    clearInterval(window.appState.analyticsInterval);
                    window.appState.analyticsInterval = null;
                }
                window.appState.currentSessionId = null;
            },

            initAnalyticsListener: () => {
                const s = window.appState.selectedStudent;
                if (s && s.id === 19 && !window.appState.analyticsUnsubscribe && window.appState.firebaseUser) {
                    window.appState.analyticsUnsubscribe = onSnapshot(
                        collection(db, 'artifacts', appId, 'public', 'data', 'analytics_logs'),
                        (snap) => {
                            let logs = [];
                            snap.forEach(doc => logs.push({ id: doc.id, ...doc.data() }));
                            logs.sort((a,b) => b.start - a.start); 
                            window.appState.analyticsData = logs;
                            
                            if (window.appState.view === 'analytics') {
                                window.app.updateAnalyticsDOM(false);
                            }
                        },
                        (error) => console.error('Analytics listener error:', error)
                    );
                }
            },

            loginAttempt: (studentId) => {
                if (studentId === 19) {
                    const html = `
                        <div class="fixed inset-0 z-[400] bg-zinc-900/60 dark:bg-black/80 flex items-end md:items-center justify-center p-0 md:p-4 backdrop-blur-xl transition-opacity animate-fade-in" onclick="window.app.closeModal()">
                            <div class="w-full max-w-sm glass-panel p-6 md:p-8 relative text-center overflow-hidden rounded-t-[32px] md:rounded-[40px] mt-auto md:mt-0 pb-safe" onclick="event.stopPropagation()" style="animation: slideUpModal 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards">
                                <div class="w-12 h-1.5 bg-zinc-300 dark:bg-zinc-700 rounded-full mx-auto mb-6 block md:hidden"></div>
                                <div class="w-16 h-16 md:w-20 md:h-20 bg-rose-50 dark:bg-rose-500/10 rounded-[20px] md:rounded-[24px] flex items-center justify-center text-rose-500 mx-auto mb-5 border border-rose-100 dark:border-rose-500/20 transform rotate-3">
                                    <i data-lucide="shield-alert" class="w-8 h-8 md:w-10 md:h-10"></i>
                                </div>
                                <h3 class="text-2xl font-black text-zinc-900 dark:text-white mb-2 tracking-tight">Доступ закрито</h3>
                                <p class="text-sm font-semibold text-zinc-500 dark:text-zinc-400 mb-6 md:mb-8 leading-relaxed">Введіть пароль адміністратора</p>
                                
                                <input type="password" id="admin-pwd-input" placeholder="••••••••" class="w-full text-center tracking-widest px-4 py-4 md:py-4 bg-white/50 dark:bg-black/40 text-zinc-900 dark:text-white border border-zinc-200/80 dark:border-white/10 rounded-[16px] md:rounded-[20px] outline-none focus:ring-2 ring-rose-500 dark:ring-rose-400 transition-all font-bold text-xl mb-6 md:mb-8 shadow-inner backdrop-blur-sm" />
                                
                                <div class="flex gap-2.5 md:gap-3">
                                    <button onclick="window.app.closeModal()" class="flex-1 py-4 rounded-[16px] md:rounded-[20px] font-bold text-sm bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-zinc-700 transition-colors active:scale-95">Скасувати</button>
                                    <button onclick="window.app.checkAdminPassword(${studentId})" class="flex-1 py-4 rounded-[16px] md:rounded-[20px] font-bold text-sm bg-rose-500 hover:bg-rose-600 text-white shadow-lg shadow-rose-500/30 transition-all active:scale-95">Увійти</button>
                                </div>
                            </div>
                        </div>
                    `;
                    document.getElementById('modals').innerHTML = html;
                    lucide.createIcons();
                    setTimeout(() => document.getElementById('admin-pwd-input')?.focus(), 100);
                } else {
                    window.app.login(studentId);
                }
            },

            checkAdminPassword: (studentId) => {
                const pwd = document.getElementById('admin-pwd-input').value;
                if (pwd === '12589') {
                    window.app.closeModal();
                    window.app.login(studentId);
                } else {
                    showToast("Невірний пароль!", true);
                }
            },

            login: (studentId) => {
                const s = students.find(x => x.id === studentId);
                if(s) {
                    window.appState.selectedStudent = s;
                    localStorage.setItem('selectedStudentId', s.id);
                    document.getElementById('auth-screen').classList.add('hidden');
                    document.getElementById('app').classList.remove('hidden');
                    window.appState.view = 'dashboard';
                    window.app.renderActiveView();
                    
                    initMultiplayer();
                    window.app.startAnalyticsSession(); 
                    window.app.initAnalyticsListener(); 
                }
            },

            logout: () => {
                stopMultiplayer();
                window.app.stopAnalyticsSession(); 
                
                if (window.appState.analyticsUnsubscribe) {
                    window.appState.analyticsUnsubscribe();
                    window.appState.analyticsUnsubscribe = null;
                }

                window.appState.selectedStudent = null;
                localStorage.removeItem('selectedStudentId');
                document.getElementById('app').classList.add('hidden');
                document.getElementById('auth-screen').classList.remove('hidden');
                window.app.renderAuthList();
            },

            toggleDark: () => {
                window.appState.isDark = !window.appState.isDark;
                localStorage.setItem('darkMode', window.appState.isDark);
                if(window.appState.isDark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                
                document.getElementById('theme-icon-header')?.setAttribute('data-lucide', window.appState.isDark ? 'sun' : 'moon');
                document.getElementById('theme-icon-auth')?.setAttribute('data-lucide', window.appState.isDark ? 'sun' : 'moon');
                lucide.createIcons();
            },

            toggleThemeDropdown: (context = 'main') => {
                const id = context === 'auth' ? 'theme-dropdown-auth' : 'theme-dropdown-main';
                const el = document.getElementById(id);
                if (el.classList.contains('hidden')) {

            updateLiveWidget: () => {
                if(window.appState.view !== 'dashboard') return;
                const widget = document.getElementById('live-widget');
                if(!widget) return;
                
                const { pri, sec } = getTheme();

                const now = new Date();
                const days = ["Неділя", "Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота"];
                const curDay = days[now.getDay()];
                const time = now.toTimeString().slice(0,5);
                let cur = null, nxt = null;
                
                for(let i=0; i<timeSlots.length; i++) {
                    if(time >= timeSlots[i].start && time <= timeSlots[i].end) { cur = {...timeSlots[i], idx: i+1}; break; }
                    if(time < timeSlots[i].start) { nxt = {...timeSlots[i], idx: i+1}; break; }
                }
                
                const searchArr = getMergedSchedule(closestWeekObj.t, closestWeekObj.n);
                const today = searchArr.find(d => d.day === curDay);
                
                const parseTime = (timeStr) => {
                    const [h, m] = timeStr.split(':').map(Number);
                    const d = new Date(); d.setHours(h, m, 0, 0); return d.getTime();
                };

                let status = {};
                if(cur) {
                    const subj = today?.pairs.find(p => p.num === cur.idx)?.subj || "Пара йде (вікно?)";
                    const start = parseTime(cur.start);
                    const end = parseTime(cur.end);
                    const progress = Math.min(100, Math.max(0, ((Date.now() - start) / (end - start)) * 100));
                    status = { label: 'Зараз триває', title: `${cur.idx} Пара`, subtitle: subj.replace(' (Начитка)',''), progress, isLive: true };
                } else if(nxt) {
                    const subj = today?.pairs.find(p => p.num === nxt.idx)?.subj || "Чекаємо...";
                    status = { label: 'Наступна пара', title: `${nxt.idx} Пара (${nxt.start})`, subtitle: subj.replace(' (Начитка)',''), progress: 0, isLive: false };
                } else {
                    status = { label: 'Статус', title: 'Пари завершено', subtitle: 'Час для відпочинку ☕', progress: 100, isLive: false };
                }

                const radius = window.innerWidth < 768 ? 32 : 44;
                const circumference = 2 * Math.PI * radius;
                const strokeDashoffset = circumference - (status.progress / 100) * circumference;
                const svgSize = window.innerWidth < 768 ? "w-20 h-20" : "w-28 h-28";
                const centerP = window.innerWidth < 768 ? 40 : 56;

                widget.innerHTML = `
                    <div class="absolute top-[-50%] right-[-20%] w-[80%] h-[150%] bg-gradient-to-bl from-${pri}-500/20 to-transparent blur-[80px] rounded-full pointer-events-none"></div>
                    
                    <div class="flex items-center gap-2.5 mb-auto z-10">
                        ${status.isLive ? `<span class="flex h-3 w-3 relative"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></span>` : '<div class="w-2.5 h-2.5 md:w-3 md:h-3 rounded-full bg-zinc-600"></div>'}
                        <span class="text-[10px] md:text-[12px] font-black uppercase tracking-widest text-zinc-400">${status.label}</span>
                    </div>

                    <div class="flex items-center justify-between z-10 mt-6 md:mt-8">
                        <div class="pr-3 md:pr-4">
                            <h2 class="text-3xl md:text-5xl font-black text-white tracking-tight mb-2 md:mb-3">${status.title}</h2>
                            <p class="text-[14px] md:text-[16px] text-zinc-400 font-bold line-clamp-2 leading-relaxed">${status.subtitle}</p>
                        </div>
                        
                        ${status.isLive ? `
                            <div class="relative ${svgSize} shrink-0 flex items-center justify-center drop-shadow-xl">
                                <svg class="transform -rotate-90 ${svgSize}">
                                    <circle cx="${centerP}" cy="${centerP}" r="${radius}" stroke="currentColor" stroke-width="6" fill="transparent" class="text-zinc-800" />
                                    <circle cx="${centerP}" cy="${centerP}" r="${radius}" stroke="currentColor" stroke-width="6" fill="transparent" stroke-dasharray="${circumference}" stroke-dashoffset="${strokeDashoffset}" class="text-${pri}-500 transition-all duration-1000 ease-in-out" stroke-linecap="round" />
                                </svg>
                                <div class="absolute inset-0 flex items-center justify-center text-white font-black text-sm md:text-base">${Math.round(status.progress)}%</div>
                            </div>
                        ` : ''}
                    </div>
                `;
            },

                const html = `
                    <div class="fixed inset-0 z-[300] bg-zinc-900/60 dark:bg-black/80 flex items-end md:items-center justify-center p-0 md:p-4 backdrop-blur-xl animate-fade-in" onclick="window.app.closeModal()">
                        <div class="w-full max-w-lg glass-panel p-6 md:p-8 relative overflow-hidden rounded-t-[32px] md:rounded-[40px] mt-auto md:mt-0 pb-safe" onclick="event.stopPropagation()" style="animation: slideUpModal 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards">
                            <div class="absolute top-0 right-0 w-72 h-72 bg-blue-500/10 blur-[80px] rounded-full pointer-events-none"></div>
                            
                            <div class="w-12 h-1.5 bg-zinc-300 dark:bg-zinc-700 rounded-full mx-auto mb-5 block md:hidden"></div>
                            <button onclick="window.app.closeModal()" class="hidden md:flex absolute top-6 right-6 w-11 h-11 items-center justify-center rounded-full bg-zinc-100 dark:bg-white/10 text-zinc-500 transition-all z-10 hover:scale-110 active:scale-95"><i data-lucide="x" class="w-5 h-5"></i></button>
                            
                            <div class="relative z-10">
                                <div class="flex items-center gap-4 mb-5 md:mb-6">
                                    <div class="w-12 h-12 md:w-14 md:h-14 bg-blue-50 dark:bg-blue-500/20 rounded-[16px] md:rounded-[18px] flex items-center justify-center text-blue-600 dark:text-blue-400 border border-blue-100 dark:border-blue-500/20"><i data-lucide="map-pin" class="w-6 h-6 md:w-7 md:h-7"></i></div>
                                    <h2 class="text-2xl md:text-3xl font-black text-zinc-900 dark:text-white tracking-tight">Місце проведення</h2>
                                </div>
                                <p class="text-blue-700 dark:text-blue-300 font-bold text-[11px] md:text-[12px] mb-6 md:mb-8 px-4 py-2.5 bg-blue-50/80 dark:bg-blue-500/10 rounded-xl inline-block tracking-wide border border-blue-100 dark:border-blue-500/20">${wLabel} • ${subj}</p>
                                
                                <div class="space-y-4 mb-6 md:mb-8">
                                    <div>
                                        <label class="block text-[10px] md:text-[11px] font-black uppercase tracking-widest text-zinc-500 mb-2 ml-1">Аудиторія (Офлайн)</label>
                                        <div class="relative">
                                            <i data-lucide="building" class="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400 w-5 h-5"></i>
                                            <input id="modal-loc-room" type="text" value="${currentRoom}" placeholder="Напр. 402, Актова зала" class="w-full pl-12 pr-4 py-4 md:py-4 bg-white/50 dark:bg-black/40 text-zinc-900 dark:text-white border border-zinc-200/80 dark:border-white/10 outline-none focus:ring-2 ring-zinc-900 dark:ring-white rounded-[16px] md:rounded-[20px] text-[15px] font-bold shadow-inner backdrop-blur-sm" />
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-[10px] md:text-[11px] font-black uppercase tracking-widest text-zinc-500 mb-2 ml-1">Zoom / Meet (Онлайн)</label>
                                        <div class="relative">
                                            <i data-lucide="link" class="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400 w-5 h-5"></i>
                                            <input id="modal-loc-url" type="url" value="${currentLink}" placeholder="https://..." class="w-full pl-12 pr-4 py-4 md:py-4 bg-white/50 dark:bg-black/40 text-zinc-900 dark:text-white border border-zinc-200/80 dark:border-white/10 outline-none focus:ring-2 ring-zinc-900 dark:ring-white rounded-[16px] md:rounded-[20px] text-[15px] font-semibold shadow-inner backdrop-blur-sm" />
                                        </div>
                                    </div>
                                </div>
                                <div class="flex gap-2.5 md:gap-3">
                                    <button onclick="window.app.closeModal()" class="flex-1 py-4 rounded-[16px] md:rounded-[20px] font-bold text-sm bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-zinc-700 transition-colors active:scale-95">Скасувати</button>
                                    <button onclick="window.app.saveLocation()" class="flex-[2] py-4 rounded-[16px] md:rounded-[20px] font-bold text-sm bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 shadow-lg transition-all active:scale-95 tracking-wide">Зберегти місце</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                document.getElementById('modals').innerHTML = html;
                lucide.createIcons();
            },

            saveLocation: () => {
                let url = document.getElementById('modal-loc-url').value.trim();
                let room = document.getElementById('modal-loc-room').value.trim();
                const subj = window.appState.tempZoomSubj;
                const weekType = window.appState.tempZoomWeekType;
                
                const specificId = `${weekType}_${subj}`.replace(/\//g, '_');
                const globalId = subj.replace(/\//g, '_');

                if(!url && !room) {
                    removeFromCloud('zoom_links', specificId, () => {});
                    removeFromCloud('zoom_links', globalId, () => {}); 
                    window.app.closeModal();
                    return;
                }
                
                if(url && !url.startsWith('http')) url = 'https://' + url;
                
                writeToCloud('zoom_links', specificId, { url: url, room: room }, () => {});
                window.app.closeModal();
            },

            deleteHomework: (id) => { window.app.openConfirmModal("Видалити ДЗ?", "Завдання буде видалено для всіх.", `window.app._doDeleteHW('${id}')`); },
            _doDeleteHW: (id) => { removeFromCloud('homeworks', id, () => {}); },

            deleteMaterial: (id) => { window.app.openConfirmModal("Видалити матеріал?", "Він зникне у всієї групи.", `window.app._doDeleteMat('${id}')`); },
            _doDeleteMat: (id) => { removeFromCloud('materials', id, () => {}); },

            handleScheduleAction: (id, isCustom, encodedSubj, weekType, day, num, weekNum) => {
                const subj = decodeURIComponent(encodedSubj);
                if (isCustom) {
                    window.app.openConfirmModal("Видалити пару?", "Вона зникне з розкладу назавжди.", `window.app._doDeleteExtra('${id}')`);
                } else {
                    const promptText = weekNum ? `Ця пара буде скасована тільки для ${weekNum} тижня.` : `Ця пара буде прихована назавжди (в шаблоні).`;
                    window.app.openConfirmModal("Скасувати пару?", promptText, `window.app._doHideSubj('${subj}', '${weekType}', '${day}', ${num}, ${weekNum || 'null'})`);
                }
            },
            _doDeleteExtra: (id) => { removeFromCloud('extra_schedule', id, () => {}); },
            
            _doHideSubj: (subj, weekType, day, num, targetWeekNum) => {
                const parsedTargetWeek = (targetWeekNum && targetWeekNum !== 'null') ? parseInt(targetWeekNum) : null;
                const docId = Date.now().toString();
                const newHidden = { id: docId, weekType, day, num: parseInt(num), subj, author: window.appState.selectedStudent.name, targetWeekNum: parsedTargetWeek };
                writeToCloud('hidden_schedule', docId, newHidden, () => {});
            },

            addExtraSchedule: () => {
                const edWeek = document.getElementById('ed-week').value;
                const edDay = document.getElementById('ed-day').value;
                const edNum = document.getElementById('ed-num').value;
                const edSubjRaw = document.getElementById('ed-subj').value;
                const targetWeekNum = document.getElementById('ed-target-week').value || null;
                const [subj, type, map] = edSubjRaw.split('|');

                const docId = Date.now().toString();
                const newPair = { id: docId, weekType: edWeek, day: edDay, num: parseInt(edNum), subj, type, map, author: window.appState.selectedStudent.name, targetWeekNum: targetWeekNum ? parseInt(targetWeekNum) : null };
                
                writeToCloud('extra_schedule', docId, newPair, () => {});
            },

            deleteExtraSchedule: (id) => { window.app.openConfirmModal("Видалити пару?", "Вона назавжди зникне.", `window.app._doDeleteExtra('${id}')`); },

            restoreHiddenSchedule: (id) => { window.app.openConfirmModal("Відновити пару?", "Пара знову з'явиться в розкладі.", `window.app._doRestoreHidden('${id}')`); },
            _doRestoreHidden: (id) => { removeFromCloud('hidden_schedule', id, () => {}); }
        };

        // --- INIT APP ---
        const initApp = async () => {
            initParticles();

            if (window.appState.isDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');

            window.app.setColorTheme(window.appState.colorTheme, true);

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error(err);
                showToast("Помилка підключення до бази", true);
            }

            onAuthStateChanged(auth, (user) => {
                window.appState.firebaseUser = user;
                if(user) {
                    onSnapshot(
                        collection(db, 'artifacts', appId, 'public', 'data', 'zoom_links'),
                        (snap) => {
                            let links = {}; snap.forEach(doc => links[doc.id] = doc.data());
                            window.appState.locationsData = links;
                            localStorage.setItem('portal-custom-locations', JSON.stringify(links));
                            if (['schedule', 'main'].includes(window.appState.view)) window.app.renderActiveView();
                        },
                        (error) => console.error('Locations error:', error)
                    );

                    onSnapshot(
                        collection(db, 'artifacts', appId, 'public', 'data', 'homeworks'),
                        (snap) => {
                            let newHwList = []; snap.forEach(doc => newHwList.push({ id: doc.id, ...doc.data() }));
                            newHwList.sort((a, b) => b.id - a.id);

                            if (window.appState.homeworks.length > 0 && window.appState.selectedStudent) {
                                const oldIds = new Set(window.appState.homeworks.map(h => h.id));
                                const addedHw = newHwList.filter(h => !oldIds.has(h.id));

                                addedHw.forEach(newDoc => {
                                    if (newDoc.author !== window.appState.selectedStudent.name && isHwRelevant(newDoc.subj, window.appState.selectedStudent)) {
                                        showToast(`📚 Нове Д/з: ${newDoc.subj.split(' ')[0]}`, false);
                                        window.appState.unreadHwCount++;
                                    }
                                });
                            }

                            window.appState.homeworks = newHwList;
                            localStorage.setItem('portal-homeworks', JSON.stringify(newHwList));
                            
                            if (['homework', 'dashboard', 'schedule', 'main'].includes(window.appState.view)) {
                                window.app.renderActiveView();
                            } else if (window.appState.selectedStudent) {
                                renderNav(); 
                            }
                        },
                        (error) => console.error('Homeworks error:', error)
                    );

                    onSnapshot(
                        collection(db, 'artifacts', appId, 'public', 'data', 'materials'),
                        (snap) => {
                            let mat = []; snap.forEach(doc => mat.push(doc.data()));
                            mat.sort((a, b) => b.id - a.id);
                            window.appState.materials = mat;
                            localStorage.setItem('portal-materials', JSON.stringify(mat));
                            if (['materials', 'dashboard'].includes(window.appState.view)) window.app.renderActiveView();
                        },
                        (error) => console.error('Materials error:', error)
                    );

                    onSnapshot(
                        collection(db, 'artifacts', appId, 'public', 'data', 'extra_schedule'),
                        (snap) => {
                            let extra = []; snap.forEach(doc => extra.push({id: doc.id, ...doc.data()}));
                            window.appState.extraSchedule = extra;
                            localStorage.setItem('portal-extra-schedule', JSON.stringify(extra));
                            if (['schedule', 'main', 'editor', 'dashboard'].includes(window.appState.view)) window.app.renderActiveView();
                        },
                        (error) => console.error('Extra schedule error:', error)
                    );

                    onSnapshot(
                        collection(db, 'artifacts', appId, 'public', 'data', 'hidden_schedule'),
                        (snap) => {
                            let hidden = []; snap.forEach(doc => hidden.push({id: doc.id, ...doc.data()}));
                            window.appState.hiddenSchedule = hidden;
                            localStorage.setItem('portal-hidden-schedule', JSON.stringify(hidden));
                            if (['schedule', 'main', 'editor', 'dashboard'].includes(window.appState.view)) window.app.renderActiveView();
                        },
                        (error) => console.error('Hidden schedule error:', error)
                    );
                    
                    window.app.initAnalyticsListener();
                }
            });

            const savedId = localStorage.getItem('selectedStudentId');
            if (savedId) {
                const s = students.find(x => x.id === parseInt(savedId));
                if (s) {
                    window.appState.selectedStudent = s;
                    document.getElementById('app').classList.remove('hidden');
                    window.app.renderActiveView();
                    
                    initMultiplayer();
                    window.app.startAnalyticsSession();

                    return;
                }
            }
            
            document.getElementById('auth-screen').classList.remove('hidden');
            window.app.renderAuthList();
            lucide.createIcons();
        };

        // Run Init
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
